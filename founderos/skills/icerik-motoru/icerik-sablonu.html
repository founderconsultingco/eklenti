<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haftanın içeriği</title>
<!--FOUNDEROS-FONT-->
<style>
/* FounderOS içerik şablonu.
   Tek girdi window.ICERIK (panel dosyası .founderos/panel/icerik.json, artı marka bloğu).
   Şablonun HTML ve CSS kısmına dokunulmaz; eksik görülürse şablon bir kez düzeltilir.
   Adresler: #s-<n> kaydırmalı gönderinin n. slaytı (1080x1350), #kapak YouTube kapağı (1280x720),
   #r-<n> n. Reels kapağı (1080x1920), #kontrol sığma denetimi, adres yoksa haftanın panosu. */
:root{
  --koyu:#06080F; --acik:#F7F6F3; --vurgu:#3BA3FF; --vy:#0A0C10; --vurgu-sis:rgba(59,163,255,.34);
  --vurgu-acikta:#1F6FC0; --yazi:#14181D; --soluk:#5B6370; --cizgi:#E2E0DA;
  --koyu-yazi:#EEF0F3; --koyu-soluk:#A7AFBA; --atm1:#2E6FD9; --atm2:#0E2A5C;
  --baslik:system-ui,sans-serif; --govde:system-ui,sans-serif;
  --agirlik:700; --aralik:-.03em; --yuvarlak:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#08090B}
body{font-family:var(--govde);color:var(--koyu-yazi);-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;font-kerning:normal}

/* ---------- ortak yüzeyler ---------- */
.yuzey{position:relative;overflow:hidden;isolation:isolate}
.yuzey.koyu{background:var(--koyu);color:var(--koyu-yazi)}
.yuzey.acik{background:var(--acik);color:var(--yazi)}
.yuzey.vurgu{background:var(--vurgu);color:var(--vy)}
/* atmosfer: koyu yüzeyin arkasındaki bulanık ışık, tek renk ailesi */
.yuzey.koyu::before{content:"";position:absolute;inset:-28%;z-index:-2;pointer-events:none;
  background:
   radial-gradient(30% 26% at 18% 12%, var(--atm1), transparent 70%),
   radial-gradient(38% 32% at 88% 92%, var(--atm2), transparent 72%);
  filter:blur(70px);opacity:.78}
.yuzey.acik::before{content:"";position:absolute;inset:-30%;z-index:-2;pointer-events:none;
  background:radial-gradient(26% 22% at 92% 6%, var(--vurgu-sis), transparent 70%);
  filter:blur(60px);opacity:.55}
.yuzey.vurgu::before{content:"";position:absolute;inset:-30%;z-index:-2;pointer-events:none;
  background:radial-gradient(40% 36% at 90% 100%, rgba(0,0,0,.22), transparent 70%),
             radial-gradient(30% 26% at 6% 0%, rgba(255,255,255,.18), transparent 70%);
  filter:blur(60px)}
/* doku: zeminde ince tane; düz renk kutusu gibi durmasın */
.yuzey::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity:.10;mix-blend-mode:overlay}
.yuzey.acik::after{opacity:.16;mix-blend-mode:multiply}

/* ---------- logo ---------- */
.logo{display:inline-flex;align-items:center;gap:.36em;font-family:var(--baslik);font-weight:var(--agirlik);
  letter-spacing:var(--aralik);line-height:1;white-space:nowrap}
.logo svg{width:1.08em;height:1.08em;flex:0 0 auto;fill:var(--vurgu);display:block}
.logo .nk{color:var(--vurgu)}
.acik .logo svg,.acik .logo .nk{fill:var(--vurgu);color:var(--vurgu)}
.vurgu .logo svg{fill:currentColor}.vurgu .logo .nk{color:currentColor}
.logo img{height:1.3em;width:auto;display:block}

/* ---------- slayt: 1080x1350 ---------- */
.sl{width:1080px;height:1350px;--k:1;display:flex;flex-direction:column;padding:84px 92px 0}
.sl .ust{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;height:60px}
.sl .ust .logo{font-size:34px}
.sayac{font:500 26px/1 var(--govde);font-variant-numeric:tabular-nums;letter-spacing:.04em;opacity:.55}
.sl .gov{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:safe center;overflow:hidden;
  padding:calc(var(--k)*24px) 0}
.sl .alt{flex:0 0 auto;height:116px;display:flex;align-items:center;justify-content:space-between;
  font:500 26px/1 var(--govde);letter-spacing:.01em}
.sl .alt .soluk{opacity:.58}
.ilerleme{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(128,128,128,.16)}
.ilerleme i{display:block;height:100%;background:var(--vurgu)}
.vurgu .ilerleme{background:rgba(0,0,0,.14)}.vurgu .ilerleme i{background:currentColor}

.ey{font:600 calc(var(--k)*25px)/1.25 var(--govde);letter-spacing:.14em;text-transform:uppercase;opacity:.66;
  margin-bottom:calc(var(--k)*30px)}
.acik .ey{color:var(--vurgu-acikta);opacity:1}
.cubuk{width:calc(var(--k)*72px);height:calc(var(--k)*9px);background:var(--vurgu);border-radius:99px;margin-bottom:calc(var(--k)*40px)}
.vurgu .cubuk{background:currentColor}
.bas{font-family:var(--baslik);font-weight:var(--agirlik);letter-spacing:var(--aralik);line-height:1.04;
  text-wrap:balance;overflow-wrap:break-word}
.h1{font-size:calc(var(--k)*104px);line-height:1.0}
.h2{font-size:calc(var(--k)*86px)}
.p{font:400 calc(var(--k)*42px)/1.42 var(--govde);text-wrap:pretty;max-width:860px;margin-top:calc(var(--k)*38px)}
.koyu .p{color:var(--koyu-soluk)}
.acik .p{color:#3A414B}
.vurgu .p{opacity:.86}
.v{white-space:nowrap}
.koyu .v{color:var(--vurgu)}
.acik .v{background:linear-gradient(transparent 62%,var(--vurgu-sis) 62%,var(--vurgu-sis) 92%,transparent 92%);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .04em}
.vurgu .v{text-decoration:underline;text-decoration-thickness:.075em;text-underline-offset:.13em}

/* kapak */
.sl.kapak .gov{justify-content:safe flex-end;padding-bottom:calc(var(--k)*56px)}
.hap{align-self:flex-start;display:inline-flex;align-items:center;gap:.6em;border:1.5px solid rgba(255,255,255,.26);
  border-radius:99px;padding:.55em 1.05em;font:600 calc(var(--k)*24px)/1 var(--govde);letter-spacing:.12em;
  text-transform:uppercase;color:var(--koyu-yazi);margin-bottom:calc(var(--k)*44px);background:rgba(255,255,255,.04)}
.hap i{width:.5em;height:.5em;border-radius:99px;background:var(--vurgu);display:block}
.kaydir{display:inline-flex;align-items:center;gap:.55em;padding:.7em 1.15em;border-radius:99px;
  background:var(--vurgu);color:var(--vy);font:600 26px/1 var(--govde)}
.kaydir svg{width:1.05em;height:1.05em;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.filigran{position:absolute;right:-210px;top:150px;width:820px;height:820px;z-index:-1;opacity:.075;pointer-events:none}
.filigran svg{width:100%;height:100%;fill:var(--vurgu);display:block}
.kisi{display:inline-flex;align-items:center;gap:18px}
.kisi .fk{width:58px;height:58px;border-radius:99px;background-size:cover;background-position:center 30%;
  border:2px solid rgba(255,255,255,.22)}

/* rakam */
.buyuk{font-family:var(--baslik);font-weight:var(--agirlik);letter-spacing:-.045em;line-height:.84;
  font-size:calc(var(--k)*300px);font-variant-numeric:lining-nums;margin-bottom:calc(var(--k)*34px)}
.buyuk small{font-size:.4em;letter-spacing:-.02em;opacity:.62;margin-left:.05em}
.koyu .buyuk{color:var(--vurgu)}
.sl.rakam .h2{font-size:calc(var(--k)*64px)}
.kaynak{font:500 calc(var(--k)*23px)/1.45 var(--govde);opacity:.62;margin-top:calc(var(--k)*44px);max-width:860px}

/* adımlar */
.adimlar{margin-top:calc(var(--k)*44px);display:flex;flex-direction:column}
.adim{display:flex;gap:calc(var(--k)*30px);align-items:flex-start;padding:calc(var(--k)*28px) 0;border-top:2px solid var(--cizgi)}
.adim:last-child{border-bottom:2px solid var(--cizgi)}
.koyu .adim{border-color:rgba(255,255,255,.12)}
.adim b{flex:0 0 auto;width:calc(var(--k)*68px);height:calc(var(--k)*68px);border-radius:calc(var(--yuvarlak) + 4px);
  background:var(--vurgu);color:var(--vy);display:flex;align-items:center;justify-content:center;
  font:var(--agirlik) calc(var(--k)*32px)/1 var(--baslik);letter-spacing:0}
.adim span{font:500 calc(var(--k)*37px)/1.36 var(--govde);padding-top:calc(var(--k)*11px);text-wrap:pretty}
.sl.adimlar-sl .p{font-size:calc(var(--k)*33px);margin-top:calc(var(--k)*34px)}

/* alıntı */
.tirnak{font-family:Georgia,"Times New Roman","DejaVu Serif",serif;font-weight:700;font-size:calc(var(--k)*230px);line-height:.72;
  color:var(--vurgu);height:calc(var(--k)*118px);margin-bottom:calc(var(--k)*18px)}
.vurgu .tirnak{color:currentColor;opacity:.9}
.soz{font-family:var(--baslik);font-weight:var(--agirlik);letter-spacing:var(--aralik);line-height:1.12;
  font-size:calc(var(--k)*68px);text-wrap:balance}
.kim{font:500 calc(var(--k)*28px)/1.45 var(--govde);opacity:.62;margin-top:calc(var(--k)*44px);display:flex;align-items:center;gap:.7em}
.kim:before{content:"";width:1.6em;height:2px;background:currentColor;opacity:.6;display:block}

/* kapanış */
.sl.kapanis .h2{font-size:calc(var(--k)*92px)}
.kart{margin-top:calc(var(--k)*64px);display:flex;align-items:center;gap:calc(var(--k)*34px);padding:calc(var(--k)*34px);
  border:1.5px solid rgba(255,255,255,.14);border-radius:calc(var(--yuvarlak)*2);background:rgba(255,255,255,.035)}
.acik .kart{border-color:var(--cizgi);background:#fff}
.foto{flex:0 0 auto;width:calc(var(--k)*150px);height:calc(var(--k)*150px);border-radius:99px;background-size:cover;background-position:center 30%}
.isaretk{flex:0 0 auto;width:calc(var(--k)*150px);height:calc(var(--k)*150px);border-radius:calc(var(--yuvarlak)*2);
  background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center}
.isaretk svg{width:56%;height:56%;fill:var(--vurgu)}
.kart .ad{font-family:var(--baslik);font-weight:var(--agirlik);letter-spacing:var(--aralik);font-size:calc(var(--k)*44px);line-height:1.1}
.kart .rol{font:400 calc(var(--k)*29px)/1.4 var(--govde);opacity:.72;margin-top:calc(var(--k)*10px);text-wrap:pretty}
.kart .adres{font:600 calc(var(--k)*27px)/1.2 var(--govde);color:var(--vurgu);margin-top:calc(var(--k)*16px)}
.acik .kart .adres{color:var(--vurgu-acikta)}

/* ---------- YouTube kapağı: 1280x720 ---------- */
.yt{width:1280px;height:720px;--k:1;display:flex;align-items:stretch;padding:60px 64px 56px 72px}
.yt .sol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.yt .sol .ic{flex:1 1 auto;display:flex;flex-direction:column;justify-content:safe center;overflow:hidden;min-height:0}
.yt .yazi{font-family:var(--baslik);font-weight:var(--agirlik);letter-spacing:var(--aralik);line-height:.98;
  font-size:calc(var(--k)*122px);text-wrap:balance}
.yt .ey2{font:700 calc(var(--k)*26px)/1 var(--govde);letter-spacing:.14em;text-transform:uppercase;color:var(--vurgu);margin-bottom:calc(var(--k)*28px)}
.yt .logo{font-size:30px}
.yt.tek .ic{max-width:940px}
.yt.tek .yazi{font-size:calc(var(--k)*138px)}
.yt .sag{flex:0 0 400px;margin-left:48px;position:relative;display:flex;align-items:center;justify-content:center}
.yt .portre{width:400px;height:540px;border-radius:calc(var(--yuvarlak)*2.4);background-size:cover;background-position:center 28%;
  position:relative}
.yt .portre:after{content:"";position:absolute;inset:0;border-radius:inherit;border:3px solid var(--vurgu)}
.yt .buyukisaret{width:380px;height:380px}
.yt .buyukisaret svg{width:100%;height:100%;fill:var(--vurgu)}

/* ---------- Reels kapağı: 1080x1920 ---------- */
.rk{width:1080px;height:1920px;--k:1;display:flex;flex-direction:column;padding:120px 96px 110px}
.rk .ust .logo{font-size:38px}
.rk .ic{flex:1 1 auto;display:flex;flex-direction:column;justify-content:safe center;overflow:hidden;min-height:0;padding:0 0 40px}
.rk .yazi{font-family:var(--baslik);font-weight:var(--agirlik);letter-spacing:var(--aralik);line-height:1.02;
  font-size:calc(var(--k)*124px);text-wrap:balance}
.rk .filigran.rkf{top:auto;bottom:260px;right:-260px;width:900px;height:900px;opacity:.07}
.rk .hap{font-size:calc(var(--k)*28px);margin-bottom:calc(var(--k)*52px)}
.rk .alt2{font:500 30px/1.3 var(--govde);opacity:.6;display:flex;justify-content:space-between}

/* ---------- varlık modu: tek varlık, tam ölçü ---------- */
body.varlik{background:#fff;margin:0;padding:0;overflow:hidden}
body.varlik #pano{display:none}
#hedef{display:none}
body.varlik #hedef{display:block}

/* ---------- pano: haftanın içeriği ---------- */
#pano{max-width:1240px;margin:0 auto;padding:40px 22px 90px;color:#E6E9EE;font:15px/1.55 var(--govde)}
body.varlik #pano{display:none}
.pust{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;padding-bottom:18px;
  border-bottom:1px solid #1A1E25;margin-bottom:22px}
.pust .logo{font-size:22px;color:#fff}
.pust h1{font:600 12px/1 var(--govde);letter-spacing:.2em;text-transform:uppercase;color:#6B7482;margin:0 0 10px}
.pust .tema{font:600 26px/1.2 var(--baslik);letter-spacing:var(--aralik);color:#fff}
.pust .tarih{color:#7F8895;font-size:13px}
.takvim{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:26px}
@media(max-width:760px){.takvim{gap:5px}.gun{padding:8px 6px 10px}.gun span em{display:none}.gun b{letter-spacing:.06em}}
.gun{background:#0E1015;border:1px solid #1A1E25;border-radius:12px;padding:10px 10px 12px;min-height:78px}
.gun b{display:block;font:600 11px/1 var(--govde);letter-spacing:.14em;text-transform:uppercase;color:#6B7482;margin-bottom:8px}
.gun span{display:flex;align-items:center;gap:6px;font-size:12px;color:#C9CED6;margin-top:5px;white-space:nowrap;overflow:hidden}
.gun span em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.gun svg{width:16px;height:16px;flex:0 0 auto}
.blok{background:#0C0E12;border:1px solid #191D24;border-radius:18px;padding:22px;margin-bottom:18px}
.bbas{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.bbas .pl{display:flex;align-items:center;gap:10px;font:600 15px/1 var(--govde);color:#fff}
.bbas .pl svg{width:26px;height:26px}
.bbas .ek{color:#7F8895;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.durum{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font:600 12px/1 var(--govde);
  background:#161A21;color:#AEB5BF}
.durum:before{content:"";width:7px;height:7px;border-radius:99px;background:#6B7482}
.durum.hazir:before{background:var(--vurgu)}
.durum.yayinda{background:rgba(46,217,160,.12);color:#7FE3BF}.durum.yayinda:before{background:#2ED9A0}
.durum.cekildi:before{background:#E0B93C}
.olcek{overflow:hidden;border-radius:10px;flex:0 0 auto;background:#000}
.olcek>.yuzey{transform-origin:0 0}
.ytsat{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
@media(max-width:860px){.ytsat{grid-template-columns:1fr}}
.ytsat h3{font:600 20px/1.3 var(--baslik);letter-spacing:var(--aralik);color:#fff;margin-bottom:8px}
.ytsat .kanca{color:#AEB5BF;margin-bottom:12px}
.ytsat ol{padding-left:18px;color:#C9CED6}
.ytsat li{margin:3px 0}
.serit{display:flex;flex-wrap:wrap;gap:12px}
.aciklama{white-space:pre-line;color:#AEB5BF;font-size:14px;margin-top:14px;max-width:760px}
.reelsler{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.reel{display:flex;gap:14px;align-items:flex-start}
.reel .bilgi{font-size:13px;color:#AEB5BF}
.reel .bilgi b{display:block;color:#fff;font:600 15px/1.3 var(--govde);margin-bottom:6px}
.limetin{white-space:pre-line;background:#fff;color:#1D2226;border-radius:12px;padding:18px 20px;max-width:640px;
  font:15px/1.55 -apple-system,"Segoe UI",Roboto,var(--govde)}
.limetin .kisi2{display:flex;align-items:center;gap:10px;margin-bottom:12px;white-space:normal}
.limetin .kisi2 i{width:40px;height:40px;border-radius:99px;background:#D9DEE3;background-size:cover;background-position:center 30%;display:block}
.limetin .kisi2 b{display:block;font-size:14px}.limetin .kisi2 small{color:#666;font-size:12px}
.bos{color:#6B7482;font-size:14px}
</style>
</head>

<div id="pano"></div>
<div id="hedef"></div>

var ATM = (M.atmosfer && M.atmosfer.length===2) ? M.atmosfer : pl.atm;
var VY = kontrast(VURGU,'#0A0C10') >= kontrast(VURGU,'#FFFFFF') ? '#0A0C10' : '#FFFFFF';
var VA = VURGU, adim = 0;
while(kontrast(VA, ACIK) < 3.4 && adim < 12){VA = karistir(VA,'#14181D',.12); adim++}
var ks = document.documentElement.style;
[['--koyu',KOYU],['--acik',ACIK],['--vurgu',VURGU],['--vy',VY],['--vurgu-sis',sis(VURGU,.34)],
 ['--vurgu-acikta',VA],['--atm1',ATM[0]],['--atm2',ATM[1]],
 ['--agirlik',tp.agirlik],['--aralik',tp.aralik],
 ['--baslik','"'+tp.baslik+'", system-ui, sans-serif'],['--govde','"'+tp.govde+'", system-ui, sans-serif']
].forEach(function(x){ks.setProperty(x[0],x[1])});
if(M.yuvarlak) ks.setProperty('--yuvarlak', M.yuvarlak);

var AD = M.ad || 'İşin adı';
var KILIT = M.kilit || 'yatay';
function isaretSvg(ad){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+(ISARET[ad]||ISARET.capraz)+'</svg>'}
function logo(){
  if(M.logo_veri) return '<span class="logo"><img src="'+M.logo_veri+'" alt=""></span>';
  var im = KILIT==='sadece-yazi' ? '' : isaretSvg(M.isaret);
  return '<span class="logo">'+im+'<span>'+k(AD)+(KILIT==='sadece-yazi'?'<span class="nk">.</span>':'')+'</span></span>';
}
function tutamak(){var h=String(M.instagram||'').trim();if(!h)return '';
  h=h.replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/[\/?#].*$/,'').replace(/^@+/,'');
  return h?'@'+h:''}
function adres(){return String(M.site||'').trim().replace(/^https?:\/\//i,'').replace(/\/$/,'')}
/* başlıklarda sayı kendinden sonraki kelimeyle aynı satırda kalır: "30 servis", "4-5 kez" */
function bagla(s){return String(s==null?'':s).replace(/(\d[\d.,:'’%-]*)[ ]+(?=\S)/g,'$1\u00a0')}
function vurgula(metin, v){
  var m=k(bagla(metin)); if(!v) return m; var vv=k(bagla(v)); var i=m.indexOf(vv);
  if(i<0) return m;
  return m.slice(0,i)+'<span class="v">'+vv+'</span>'+m.slice(i+vv.length);
}
var OK = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* ---------- slayt türü ---------- */
function turBul(s,i,n){
  if(s.tur) return s.tur;
  if(i===0) return 'kapak';
  if(i===n-1) return 'kapanis';
  if(s.rakam) return 'rakam';
  if(s.maddeler && s.maddeler.length) return 'adimlar';
  return 'metin';
}
var VARSAYILAN_ZEMIN = {kapak:'koyu',metin:'acik',rakam:'vurgu',adimlar:'acik',alinti:'koyu',kapanis:'koyu'};

function slayt(i){
  var n = SL.length, s = SL[i] || {}, t = turBul(s,i,n);
  var z = s.zemin || VARSAYILAN_ZEMIN[t] || 'acik';
  var sinif = 'yuzey sl '+z+' '+(t==='adimlar'?'adimlar-sl':t);
  var ust = '<div class="ust">'+logo()+'<span class="sayac">'+(i+1)+'/'+n+'</span></div>';
  var g = '';
  if(t==='kapak'){
    g = (s.ust?'<div class="hap"><i></i>'+k(s.ust)+'</div>':'')+
        '<div class="bas h1">'+vurgula(s.baslik,s.vurgu)+'</div>'+
        (s.metin?'<div class="p">'+k(s.metin)+'</div>':'');
  } else if(t==='rakam'){
    var r = String(s.rakam||''), bol = r.indexOf('/');
    var rk = bol>0 ? k(r.slice(0,bol))+'<small>'+k(r.slice(bol))+'</small>' : k(r);
    g = (s.ust?'<div class="ey">'+k(s.ust)+'</div>':'')+
        '<div class="buyuk">'+rk+'</div>'+
        '<div class="bas h2">'+vurgula(s.baslik,s.vurgu)+'</div>'+
        (s.metin?'<div class="p">'+k(s.metin)+'</div>':'')+
        (s.kaynak?'<div class="kaynak">'+k(s.kaynak)+'</div>':'');
  } else if(t==='adimlar'){
    g = (s.ust?'<div class="ey">'+k(s.ust)+'</div>':'<div class="cubuk"></div>')+
        '<div class="bas h2">'+vurgula(s.baslik,s.vurgu)+'</div>'+
        '<div class="adimlar">'+(s.maddeler||[]).map(function(m,j){
          return '<div class="adim"><b>'+(j+1)+'</b><span>'+k(m)+'</span></div>'}).join('')+'</div>'+
        (s.metin?'<div class="p">'+k(s.metin)+'</div>':'');
  } else if(t==='alinti'){
    g = '<div class="tirnak">&ldquo;</div>'+
        '<div class="soz">'+vurgula(String(s.baslik||'').replace(/^["“]+|["”]+$/g,''),s.vurgu)+'</div>'+
        (s.metin?'<div class="kim">'+k(s.metin)+'</div>':'');
  } else if(t==='kapanis'){
    var foto = M.foto_veri ? '<div class="foto" style="background-image:url('+M.foto_veri+')"></div>'
                           : (KILIT==='sadece-yazi' ? '' : '<div class="isaretk">'+isaretSvg(M.isaret)+'</div>');
    var rol = s.rol || M.rol || '';
    var adr = [tutamak(), adres()].filter(Boolean).join('  ·  ');
    g = (s.ust?'<div class="ey">'+k(s.ust)+'</div>':'<div class="cubuk"></div>')+
        '<div class="bas h2">'+vurgula(s.baslik,s.vurgu)+'</div>'+
        (s.metin?'<div class="p">'+k(s.metin)+'</div>':'')+
        '<div class="kart">'+foto+'<div><div class="ad">'+k(M.kurucu||AD)+'</div>'+
        (rol?'<div class="rol">'+k(rol)+'</div>':'')+(adr?'<div class="adres">'+k(adr)+'</div>':'')+'</div></div>';
  } else {
    g = (s.ust?'<div class="ey">'+k(s.ust)+'</div>':'<div class="cubuk"></div>')+
        '<div class="bas h2">'+vurgula(s.baslik,s.vurgu)+'</div>'+
        (s.metin?'<div class="p">'+k(s.metin)+'</div>':'');
  }
  var sol, sag;
  if(t==='kapak'){
    sol = M.foto_veri
      ? '<span class="kisi"><span class="fk" style="background-image:url('+M.foto_veri+')"></span><span>'+k(M.kurucu||'')+'</span></span>'
      : '<span class="soluk">'+k(M.kurucu||tutamak()||'')+'</span>';
    sag = '<span class="kaydir">'+k(s.kaydir||'Kaydırın')+OK+'</span>';
  } else if(t==='kapanis'){
    sol = '<span class="soluk">'+k(s.cagri_alt||'Bağlantı profilde')+'</span>';
    sag = '<span class="soluk">'+k(M.sehir||'')+'</span>';
  } else {
    sol = '<span class="soluk">'+k(tutamak()||adres())+'</span>';
    sag = '<span class="soluk">'+k(M.sehir||'')+'</span>';
  }
  var fil = (t==='kapak' && KILIT!=='sadece-yazi' && !M.logo_veri) ? '<div class="filigran">'+isaretSvg(M.isaret)+'</div>' : '';
  var il = '<div class="ilerleme"><i style="width:'+((i+1)/Math.max(n,1)*100).toFixed(2)+'%"></i></div>';
  return '<section class="'+sinif+'" data-id="s-'+(i+1)+'">'+fil+ust+'<div class="gov">'+g+'</div>'+
         '<div class="alt">'+sol+sag+'</div>'+il+'</section>';
}

function ytKapak(){
  var yazi = ANA.kapak_yazisi || ANA.baslik || '';
  var sag = M.foto_veri ? '<div class="portre" style="background-image:url('+M.foto_veri+')"></div>'
          : (KILIT==='sadece-yazi' ? '' : '<div class="buyukisaret">'+isaretSvg(M.isaret)+'</div>');
  return '<section class="yuzey yt koyu'+(sag?'':' tek')+'" data-id="kapak"><div class="sol"><div>'+logo()+'</div><div class="ic">'+
    (ANA.kapak_ust?'<div class="ey2">'+k(ANA.kapak_ust)+'</div>':'')+
    '<div class="yazi">'+vurgula(yazi, ANA.kapak_vurgu)+'</div></div><div></div></div>'+
    (sag?'<div class="sag">'+sag+'</div>':'')+'</section>';
}

function reelsKapak(j){
  var r = REELS[j] || {};
  var ustyazi = r.ust || ANA.kapak_ust || (SL[0] && SL[0].ust) || '';
  var fil = (KILIT!=='sadece-yazi' && !M.logo_veri) ? '<div class="filigran rkf">'+isaretSvg(M.isaret)+'</div>' : '';
  return '<section class="yuzey rk koyu" data-id="r-'+(j+1)+'">'+fil+'<div class="ust" style="display:flex;justify-content:space-between;align-items:center">'+
    logo()+'</div><div class="ic">'+(ustyazi?'<div class="hap"><i></i>'+k(ustyazi)+'</div>':'')+
    '<div class="yazi">'+vurgula(r.ekran_yazisi||r.baslik||'', r.vurgu)+'</div></div>'+
    '<div class="alt2"><span>'+k(M.kurucu||'')+'</span><span>'+k(tutamak()||adres())+'</span></div></section>';
}

/* ---------- sığdırma: taşan varlığın yazı ölçeğini küçültür ---------- */
function sigdir(el){
  var ic = el.querySelector('.gov, .ic');
  if(!ic) return {k:1,tasti:false};
  function tasiyor(){
    if(ic.scrollHeight > ic.clientHeight + 1) return true;
    var b = el.querySelectorAll('.bas,.yazi,.soz,.buyuk');
    for(var x=0;x<b.length;x++){ if(b[x].scrollWidth > b[x].clientWidth + 1) return true; }
    return false;
  }
  var olcu = 1;
  el.style.setProperty('--k', olcu);
  while(tasiyor() && olcu > 0.7){ olcu = Math.round((olcu - 0.03)*100)/100; el.style.setProperty('--k', olcu); }
  return {k:olcu, tasti:tasiyor()};
}

function varliklar(){
  var v = [];
  for(var i=0;i<SL.length;i++) v.push({id:'s-'+(i+1), en:1080, boy:1350, ciz:(function(i){return function(){return slayt(i)}})(i)});
  if(ANA && (ANA.kapak_yazisi || ANA.baslik)) v.push({id:'kapak', en:1280, boy:720, ciz:ytKapak});
  for(var j=0;j<REELS.length;j++) if(REELS[j] && (REELS[j].ekran_yazisi||REELS[j].baslik))
    v.push({id:'r-'+(j+1), en:1080, boy:1920, ciz:(function(j){return function(){return reelsKapak(j)}})(j)});
  return v;
}

/* ---------- pano ---------- */
var LOGOLAR = {
 youtube:'<svg viewBox="0 0 28 20" aria-label="YouTube"><rect width="28" height="20" rx="5.5" fill="#FF0033"/><path d="M11.2 5.6v8.8l7.6-4.4z" fill="#fff"/></svg>',
 instagram:'<svg viewBox="0 0 24 24" aria-label="Instagram"><defs><linearGradient id="igr" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".3" stop-color="#FA7E1E"/><stop offset=".55" stop-color="#D62976"/><stop offset=".8" stop-color="#962FBF"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect width="24" height="24" rx="6.6" fill="url(#igr)"/><rect x="5" y="5" width="14" height="14" rx="4.3" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.3" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.4" cy="7.6" r="1.05" fill="#fff"/></svg>',
 linkedin:'<svg viewBox="0 0 24 24" aria-label="LinkedIn"><rect width="24" height="24" rx="4.5" fill="#0A66C2"/><path d="M6.9 9.8h2.6v7.6H6.9zM8.2 5.9a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM11.1 9.8h2.5v1.05c.4-.7 1.3-1.25 2.6-1.25 2.6 0 3.1 1.7 3.1 3.9v3.9h-2.6v-3.45c0-.85 0-1.95-1.2-1.95s-1.4.9-1.4 1.9v3.5h-2.6z" fill="#fff"/></svg>',
 cekim:'<svg viewBox="0 0 24 24" aria-label="Çekim"><rect width="24" height="24" rx="6" fill="#20242C"/><rect x="5" y="8" width="10" height="8" rx="2" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M15 11l4-2.2v6.4L15 13z" fill="#fff"/></svg>'
};
LOGOLAR.reels = LOGOLAR.instagram; LOGOLAR.carousel = LOGOLAR.instagram;
var TUR_AD = {youtube:'YouTube', reels:'Reels', carousel:'Kaydırmalı gönderi', linkedin:'LinkedIn', cekim:'Çekim'};
var DURUM_AD = {hazir:'Hazır', cekildi:'Çekildi', yayinda:'Yayında', bekliyor:'Çekim bekliyor', atlandi:'Atlandı'};
function durum(d){return d?'<span class="durum '+k(d)+'">'+k(DURUM_AD[d]||d)+'</span>':''}
function tarihAd(g, uzun){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(g||''));
  if(!m) return k(g||'');
  var d = new Date(+m[1], +m[2]-1, +m[3], 12);
  try{ return k(d.toLocaleDateString('tr-TR', uzun?{weekday:'long',day:'numeric',month:'long'}:{weekday:'short'})) }catch(e){ return k(g) }
}
function olcek(html, en, boy, genislik){
  var s = genislik/en;
  return '<div class="olcek" style="width:'+Math.round(en*s)+'px;height:'+Math.round(boy*s)+'px">'+
    html.replace('<section class="','<section style="transform:scale('+s.toFixed(4)+')" class="')+'</div>';
}
function pano(){
  var H = I.hafta || {}, T = I.takvim || [];
  var bas = '<div class="pust"><div><h1>Haftanın içeriği</h1><div class="tema">'+k(H.tema||ANA.baslik||'')+'</div></div>'+
    '<div style="text-align:right">'+logo()+'<div class="tarih" style="margin-top:8px">'+(H.baslangic?tarihAd(H.baslangic,true)+' haftası':'')+'</div></div></div>';
  var gunler = '';
  if(H.baslangic && /^\d{4}-\d{2}-\d{2}$/.test(H.baslangic)){
    var p = H.baslangic.split('-'), b0 = new Date(+p[0], +p[1]-1, +p[2], 12);
    for(var g=0; g<7; g++){
      var d = new Date(b0.getTime()+g*864e5);
      var iso = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
      var isler = T.filter(function(x){return x.gun===iso});
      gunler += '<div class="gun"><b>'+tarihAd(iso,false)+' '+d.getDate()+'</b>'+
        isler.map(function(x){return '<span title="'+k(x.etiket||TUR_AD[x.tur]||x.tur)+'">'+(LOGOLAR[x.tur]||'')+'<em>'+k(x.etiket||TUR_AD[x.tur]||x.tur)+'</em></span>'}).join('')+'</div>';
    }
    gunler = '<div class="takvim">'+gunler+'</div>';
  }
  var yt = '';
  if(ANA && ANA.baslik){
    yt = '<div class="blok"><div class="bbas"><div class="pl">'+LOGOLAR.youtube+'YouTube videosu</div>'+
      '<div class="ek">'+(ANA.gun?tarihAd(ANA.gun,true):'')+(ANA.sure_dk?' · yaklaşık '+k(ANA.sure_dk)+' dakika':'')+durum(ANA.durum)+'</div></div>'+
      '<div class="ytsat">'+olcek(ytKapak(),1280,720,420)+'<div><h3>'+k(ANA.baslik)+'</h3>'+
      (ANA.kanca?'<div class="kanca">'+k(ANA.kanca)+'</div>':'')+
      '<ol>'+(ANA.bolumler||[]).map(function(b){return '<li>'+k(b.baslik)+'</li>'}).join('')+'</ol></div></div></div>';
  }
  var car = '';
  if(SL.length){
    car = '<div class="blok"><div class="bbas"><div class="pl">'+LOGOLAR.instagram+'Kaydırmalı gönderi · '+SL.length+' görsel</div>'+
      '<div class="ek">'+(CAR.gun?tarihAd(CAR.gun,true):'')+durum(CAR.durum)+'</div></div>'+
      '<div class="serit">'+SL.map(function(_,i){return olcek(slayt(i),1080,1350,236)}).join('')+'</div>'+
      (CAR.aciklama?'<div class="aciklama">'+k(CAR.aciklama)+'</div>':'')+'</div>';
  }
  var re = '';
  if(REELS.length){
    re = '<div class="blok"><div class="bbas"><div class="pl">'+LOGOLAR.instagram+'Reels · videodan '+REELS.length+' kesit</div></div><div class="reelsler">'+
      REELS.map(function(r,j){return '<div class="reel">'+olcek(reelsKapak(j),1080,1920,120)+'<div class="bilgi"><b>'+k(r.ekran_yazisi||r.baslik||'')+'</b>'+
        (r.gun?tarihAd(r.gun,true)+' ':'')+durum(r.durum)+'<div style="margin-top:8px">'+k(r.kesit||'')+'</div></div></div>'}).join('')+'</div></div>';
  }
  var li = '';
  if(LI){
    var fk = M.foto_veri ? ' style="background-image:url('+M.foto_veri+')"' : '';
    li = '<div class="blok"><div class="bbas"><div class="pl">'+LOGOLAR.linkedin+'LinkedIn gönderisi</div>'+
      '<div class="ek">'+(LI.gun?tarihAd(LI.gun,true):'')+durum(LI.durum)+'</div></div>'+
      '<div class="limetin"><div class="kisi2"><i'+fk+'></i><div><b>'+k(M.kurucu||AD)+'</b><small>'+k(M.rol||'')+'</small></div></div>'+k(LI.metin||'')+'</div></div>';
  }
  var ic = bas+gunler+yt+car+re+li;
  if(!yt && !car && !re && !li) ic = bas+'<div class="bos">Bu haftanın içeriği henüz yazılmadı.</div>';
  document.getElementById('pano').innerHTML = ic;
}

/* ---------- açılış ---------- */
var h = location.hash.replace(/^#/,'');
var liste = varliklar();
function hazir(fn){
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fn, fn) } else { fn() }
}
if(h==='kontrol'){
  document.body.className='varlik';
  var kutu = document.getElementById('hedef');
  kutu.style.cssText = 'position:absolute;left:0;top:0;width:1280px';
  kutu.innerHTML = liste.map(function(v){return v.ciz()}).join('');
  hazir(function(){
    var sonuc = {slayt:SL.length, reels:REELS.length, kapak:liste.some(function(v){return v.id==='kapak'}),
                 varliklar:liste.map(function(v){return v.id}), tasma:[], olcek:{}};
    var els = kutu.querySelectorAll('section[data-id]');
    for(var x=0;x<els.length;x++){
      var r = sigdir(els[x]), id = els[x].getAttribute('data-id');
      sonuc.olcek[id] = r.k; if(r.tasti) sonuc.tasma.push(id);
    }
    document.title = 'KONTROL ' + JSON.stringify(sonuc);
  });
} else {
  var hed = null;
  for(var q=0;q<liste.length;q++) if(liste[q].id===h) hed = liste[q];
  if(hed){
    document.body.className='varlik';
    var kutu2 = document.getElementById('hedef');
    kutu2.innerHTML = hed.ciz();
    var st = document.createElement('style');
    st.textContent = 'html,body{width:'+hed.en+'px;height:'+hed.boy+'px;margin:0;padding:0;overflow:hidden;background:'+KOYU+'}';
    document.head.appendChild(st);
    hazir(function(){ sigdir(kutu2.firstElementChild); document.title = 'HAZIR '+h; });
  } else {
    document.title = (AD ? AD+' · ' : '') + 'Haftanın içeriği';
    pano();
    hazir(function(){
      var els = document.querySelectorAll('#pano section[data-id]');
      for(var x=0;x<els.length;x++) sigdir(els[x]);
    });
  }
}
window.VARLIKLAR = liste.map(function(v){return {ad:v.id,en:v.en,boy:v.boy}});
})();
</script>
