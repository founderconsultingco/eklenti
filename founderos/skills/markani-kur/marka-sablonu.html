<title>Marka kiti</title>
<style>
:root{
  --koyu:#12161B; --acik:#F7F6F3; --vurgu:#E0492F; --vurgu-yazi:#fff;
  --yazi:#14181D; --soluk:#6A7280; --cizgi:#E4E2DD; --koyu-yazi:#EDEFF2;
  --yuvarlak:10px; --baslik:system-ui,sans-serif; --govde:system-ui,sans-serif;
  --olcu:1180px;
}
*{box-sizing:border-box}
body{margin:0;background:#EDEBE6;color:var(--yazi);font:15px/1.6 var(--govde);
  -webkit-font-smoothing:antialiased}
.tahta{max-width:var(--olcu);margin:0 auto;padding:40px 20px 80px}
.ust{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;margin-bottom:26px;border-bottom:1px solid #D8D5CE}
.ust b{font:600 15px/1.3 var(--baslik)}
.ust span{color:var(--soluk);font-size:13px}
.pano{background:var(--acik);border:1px solid var(--cizgi);border-radius:calc(var(--yuvarlak) + 6px);
  padding:34px;margin-bottom:22px;overflow:hidden}
.pano.koyu{background:var(--koyu);color:var(--koyu-yazi);border-color:#000}
.no{font:600 11px/1 var(--govde);letter-spacing:.14em;text-transform:uppercase;color:var(--soluk);
  display:block;margin-bottom:18px}
.pano.koyu .no{color:#8A929C}
h2{font:600 22px/1.25 var(--baslik);margin:0 0 6px}
h3{font:600 13px/1.3 var(--govde);margin:0 0 8px;color:var(--soluk);
  letter-spacing:.06em;text-transform:uppercase}
p{margin:0 0 12px;max-width:62ch}
.gr{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* --- logo --- */
.marka{display:inline-flex;align-items:center;gap:.5em;font-family:var(--baslik);
  font-weight:650;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.marka .sm{display:inline-flex;align-items:center;justify-content:center;
  width:1.15em;height:1.15em;border-radius:calc(var(--yuvarlak) * .5);
  background:var(--vurgu);color:var(--vurgu-yazi);font-size:.82em;font-weight:700;
  letter-spacing:0;flex:0 0 auto}
.marka.dikey{flex-direction:column;gap:.42em;text-align:center;white-space:normal}
.marka.dikey .sm{width:1.9em;height:1.9em;font-size:.9em}
.marka.tek .sm{background:currentColor;color:var(--acik)}
.kutu{border:1px solid var(--cizgi);border-radius:var(--yuvarlak);padding:26px;
  display:flex;align-items:center;justify-content:center;min-height:118px;background:#fff}
.kutu.k{background:var(--koyu);border-color:#000;color:var(--koyu-yazi)}
.kutu .et{position:absolute}
.kk{position:relative}
.kk figcaption{font-size:12px;color:var(--soluk);margin-top:8px}
.pano.koyu .kk figcaption{color:#8A929C}

/* --- renk --- */
.renkler{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.renk{border:1px solid var(--cizgi);border-radius:var(--yuvarlak);overflow:hidden;background:#fff}
.renk i{display:block;height:78px}
.renk b{display:block;padding:10px 12px 2px;font:600 13px/1.2 var(--govde)}
.renk s{display:block;padding:0 12px 11px;text-decoration:none;color:var(--soluk);
  font:12px/1.4 ui-monospace,Menlo,monospace}
.oran{display:flex;height:12px;border-radius:99px;overflow:hidden;margin-top:16px}
.oran i{display:block}

/* --- tipografi --- */
.ol{border-top:1px solid var(--cizgi);padding-top:14px;margin-top:14px}
.ol:first-child{border:0;padding:0;margin:0}
.ol em{font-style:normal;color:var(--soluk);font-size:12px;display:block;margin-bottom:4px}
.d1{font:650 42px/1.1 var(--baslik);letter-spacing:-.025em}
.d2{font:650 26px/1.2 var(--baslik);letter-spacing:-.015em}
.d3{font:600 18px/1.3 var(--baslik)}
.d4{font:400 16px/1.65 var(--govde)}
.d5{font:400 13px/1.5 var(--govde);color:var(--soluk)}
.turkce{font-size:19px;line-height:1.5;margin-top:10px}

/* --- liste --- */
ul.im{list-style:none;padding:0;margin:0}
ul.im li{padding:7px 0 7px 24px;position:relative;border-bottom:1px solid var(--cizgi)}
ul.im li:last-child{border:0}
ul.im li::before{content:"";position:absolute;left:2px;top:15px;width:8px;height:8px;
  border-radius:2px;background:var(--vurgu)}
ul.im.yok li::before{background:none;border:1px solid var(--soluk);border-radius:99px}

/* --- yanlis kullanim --- */
.yanlis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.yanlis{grid-template-columns:1fr 1fr}}
.yan{position:relative;border:1px solid var(--cizgi);border-radius:var(--yuvarlak);
  background:#fff;height:96px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.yan::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top right,transparent calc(50% - 1px),#D23B2A,transparent calc(50% + 1px))}
.yan figcaption{position:absolute;bottom:0;left:0;right:0;background:#D23B2A;color:#fff;
  font-size:11px;padding:3px 6px;text-align:center;z-index:2}
.e1 .marka{transform:scaleX(1.5)}
.e2 .marka{font-size:9px}
.e3 .marka{color:#2E7D32}
.e3 .marka .sm{background:#2E7D32}
.e4{background:linear-gradient(135deg,#7a6a55,#bcae95)}
.e5 .marka{letter-spacing:.3em}
.e6 .marka .sm{border-radius:99px;transform:rotate(-14deg)}

/* --- ikon --- */
.ikonlar{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
@media(max-width:820px){.ikonlar{grid-template-columns:repeat(4,1fr)}}
.ikonlar div{border:1px solid var(--cizgi);border-radius:var(--yuvarlak);background:#fff;
  aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.ikonlar svg{width:28px;height:28px;stroke:var(--yazi);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* --- site basligi onizleme --- */
.siteonz{border:1px solid var(--cizgi);border-radius:var(--yuvarlak);overflow:hidden;background:#fff;
  height:100%;display:flex;flex-direction:column;font-size:16px}
.siteonz .bar{display:flex;align-items:center;gap:.5em;padding:.55em .75em;background:#ECEAE5;
  border-bottom:1px solid var(--cizgi);flex:0 0 auto}
.siteonz .bar i{width:.56em;height:.56em;border-radius:99px;background:#CFCBC3;display:block;flex:0 0 auto}
.siteonz .bar u{flex:1;text-decoration:none;background:#fff;border-radius:99px;
  font-size:.7em;color:var(--soluk);padding:.25em .8em;margin-left:.4em}
.sh{background:var(--koyu);color:var(--koyu-yazi);padding:1.9em 2.1em 2.6em;position:relative;
  overflow:hidden;flex:1;display:flex;flex-direction:column}
.sh::before{content:"";position:absolute;inset:0;opacity:.5;
  background:radial-gradient(120% 90% at 84% 6%,rgba(255,255,255,.16),transparent 62%)}
.sh>*{position:relative}
.shust{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto;
  padding-bottom:2.1em}
.hap{align-self:flex-start;border:1px solid rgba(255,255,255,.28);border-radius:99px;
  padding:.35em .85em;font-size:.76em;color:#C9CFD6;margin-bottom:.9em}
.sh h4{font:650 2.15em/1.13 var(--baslik);letter-spacing:-.025em;margin:0 0 .35em;max-width:15ch}
.sh h4 span{color:var(--vurgu)}
.sh p{color:#AEB6C0;max-width:42ch;margin:0 0 1.3em;font-size:.95em}
.dug{align-self:flex-start;background:var(--vurgu);color:var(--vurgu-yazi);
  border-radius:var(--yuvarlak);padding:.78em 1.4em;font:600 .88em/1 var(--govde);text-decoration:none}
.dug.ince{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.3)}

/* --- sosyal --- */
.kare{aspect-ratio:4/5;border-radius:var(--yuvarlak);overflow:hidden;position:relative;
  font-size:16px;background:var(--koyu);color:var(--koyu-yazi);padding:1.6em;
  display:flex;flex-direction:column;justify-content:space-between}
.kare.ters{background:var(--acik);color:var(--yazi)}
.kare.vur{background:var(--vurgu);color:var(--vurgu-yazi)}
.kare::before{content:"";position:absolute;inset:0;opacity:.42;
  background:radial-gradient(110% 80% at 88% 4%,rgba(255,255,255,.2),transparent 60%)}
.kare>*{position:relative}
.kust{font:600 .68em/1 var(--govde);letter-spacing:.14em;text-transform:uppercase;opacity:.72}
.kare b{font:650 1.62em/1.2 var(--baslik);letter-spacing:-.022em;display:block}
.kare small{display:block;font-size:.82em;opacity:.78;margin-top:.7em;line-height:1.5}
.karealt{display:flex;justify-content:space-between;align-items:center;gap:.8em;
  font-size:.72em;opacity:.7;flex-wrap:wrap}
.hik{aspect-ratio:9/16}
.hik b{font-size:1.4em}
.ban{aspect-ratio:1640/856}
.ban b{font-size:1.9em}
.profil{width:112px;height:112px;border-radius:99px;background:var(--vurgu);color:var(--vurgu-yazi);
  display:flex;align-items:center;justify-content:center;font:700 40px/1 var(--baslik)}

/* --- kurumsal --- */
.kv{aspect-ratio:85/55;border-radius:.42em;border:1px solid var(--cizgi);background:#fff;
  font-size:16px;padding:1.5em;display:flex;flex-direction:column;justify-content:space-between}
.kv.k{background:var(--koyu);color:var(--koyu-yazi);border-color:#000}
.kv .ad{font:600 .92em/1.3 var(--govde);margin-bottom:.35em}
.kv .sat{font-size:.72em;color:var(--soluk);line-height:1.75}
.kv.k .sat{color:#9AA3AE}
.kagit{aspect-ratio:1/1.414;background:#fff;border:1px solid var(--cizgi);border-radius:.4em;
  font-size:11px;padding:2.4em;display:flex;flex-direction:column;line-height:1.7;color:var(--soluk)}
.kagit .cizgik{flex:1;margin:2em 0}
.kagit .cizgik i{display:block;height:.55em;background:#EEECE7;border-radius:99px;margin-bottom:.85em}
.kagit .cizgik i:nth-child(3){width:72%}
.kagit .cizgik i:nth-child(6){width:54%}
.imza{border:1px solid var(--cizgi);border-radius:var(--yuvarlak);background:#fff;
  font-size:13px;padding:1.3em 1.45em;line-height:1.7;color:var(--soluk)}
.imza b{display:block;color:var(--yazi);font-size:1.08em;margin-bottom:.15em}
.imza hr{border:0;border-top:.16em solid var(--vurgu);width:2.8em;margin:.75em 0}

/* --- hizli referans --- */
.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px}
.ref dl{margin:0}
.ref dt{font:600 11px/1 var(--govde);letter-spacing:.12em;text-transform:uppercase;
  color:var(--soluk);margin-bottom:7px}
.ref dd{margin:0 0 4px;font:13px/1.6 ui-monospace,Menlo,monospace}

/* --- varlik modu: tek varlik, tam olcu --- */
body.varlik{background:#fff;padding:0;margin:0;display:block}
body.varlik .tahta{display:none}
#vhedef{display:none}
body.varlik #vhedef{display:block}
body.varlik #vhedef>*{border-radius:0;border:0;margin:0}
.saydam{background:transparent!important}
html[data-varlik="sembol"],html[data-varlik="sembol"] body,
html[data-varlik="sembol"] #vhedef{background:transparent!important}
@page{margin:0}
</style>

<div class="tahta" id="tahta"></div>
<div id="vhedef"></div>

<script>
/*FOUNDEROS-MARKA*/
(function(){
var M = window.MARKA || {};
function k(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var r = M.renk||{}, f = M.yazi_tipi||{}, ks = document.documentElement.style;
var RENK = {koyu:'#12161B',acik:'#F7F6F3',vurgu:'#E0492F',vurgu_yazi:'#ffffff',
            yazi:'#14181D',soluk:'#6A7280',cizgi:'#E4E2DD',koyu_yazi:'#EDEFF2'};
Object.keys(RENK).forEach(function(n){ if(r[n]) RENK[n]=r[n];
  ks.setProperty('--'+n.replace(/_/g,'-'),RENK[n]); });
if(M.yuvarlak) ks.setProperty('--yuvarlak',M.yuvarlak);
if(f.baslik) ks.setProperty('--baslik',f.baslik);
if(f.govde) ks.setProperty('--govde',f.govde);
if(M.yon) document.documentElement.setAttribute('data-yon',M.yon);
document.title = (M.ad||'Marka kiti')+' marka kiti';

var AD = M.ad||'İşin adı';
var KISA = (M.kisa || AD.split(/\s+/).map(function(w){return w.charAt(0)}).join('').slice(0,2)).toLocaleUpperCase('tr');
var IL = M.iletisim||{};

/* ---------- tek kaynak: logo ---------- */
function logo(o){
  o = o||{};
  var c=['marka']; if(o.dikey)c.push('dikey'); if(o.tek)c.push('tek');
  var by=o.boy||24; var st='font-size:'+(typeof by==='string'?by:by+'px');
  if(o.renk) st+=';color:'+o.renk;
  var sm = o.sembolsuz ? '' : '<span class="sm">'+k(KISA)+'</span>';
  return '<span class="'+c.join(' ')+'" style="'+st+'">'+sm+'<span>'+k(AD)+'</span></span>';
}

/* ---------- sekiz ikon, sabit; model cizmiyor ---------- */
var IKON = {
 telefon:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/>',
 mesaj:'<path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 10h8M8 13h5"/>',
 takvim:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 saat:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
 kisi:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 yildiz:'<path d="m12 3 2.7 5.9 6.3.7-4.7 4.4 1.3 6.4L12 17.2 6.4 20.4l1.3-6.4L3 9.6l6.3-.7Z"/>',
 grafik:'<path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/>',
 onay:'<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/>'
};
function ikon(ad){return '<svg viewBox="0 0 24 24">'+(IKON[ad]||'')+'</svg>'}

/* ---------- sosyal parcalar ---------- */
var S = M.sosyal||{};
function kare(o,sinif,stil){
  o=o||{};
  return '<div class="kare '+(sinif||'')+'" style="'+(stil||'')+'">'+
    '<div class="kust">'+k(o.ustyazi||M.sehir||'')+'</div>'+
    '<div><b>'+k(o.baslik||'')+'</b><small>'+k(o.alt||'')+'</small></div>'+
    '<div class="karealt">'+logo({boy:'1.05em',renk:'currentColor'})+'<span>'+k(IL.site||'')+'</span></div></div>';
}
function kartvizit(arka,stil){
  stil = stil||'';
  if(arka) return '<div class="kv k" style="'+stil+'"><div>'+logo({boy:'1.15em',renk:'currentColor'})+'</div>'+
    '<div class="sat">'+k(M.konum||'')+'</div></div>';
  return '<div class="kv" style="'+stil+'"><div>'+logo({boy:'1.15em'})+'</div><div>'+
    '<div class="ad">'+k(M.kurucu||'')+'</div><div class="sat">'+
    [IL.telefon,IL.eposta,IL.site].filter(Boolean).map(k).join('<br>')+'</div></div></div>';
}
function antetli(stil){
  return '<div class="kagit" style="'+(stil||'')+'"><div style="display:flex;justify-content:space-between;align-items:center">'+
    logo({boy:'1.5em'})+'<span>'+k(M.sehir||'')+'</span></div>'+
    '<div class="cizgik"><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
    '<div style="border-top:1px solid var(--cizgi);padding-top:8px">'+
    [IL.telefon,IL.eposta,IL.site].filter(Boolean).map(k).join(' &nbsp;·&nbsp; ')+'</div></div>';
}
function imza(){
  return '<div class="imza">'+logo({boy:'1.3em'})+'<hr>'+
    '<b>'+k(M.kurucu||'')+'</b>'+k(M.konum||'')+'<br>'+
    [IL.telefon,IL.eposta,IL.site].filter(Boolean).map(k).join(' · ')+'</div>';
}
function siteBasligi(cerceve){
  var b = M.site_basligi||{};
  var bas = k(b.baslik||M.konum||'');
  if(b.vurgu) bas = bas.replace(k(b.vurgu),'<span>'+k(b.vurgu)+'</span>');
  return '<div class="siteonz">'+(cerceve?'<div class="bar"><i></i><i></i><i></i><u>'+k(IL.site||'')+'</u></div>':'')+
   '<div class="sh"><div class="shust">'+logo({boy:'1.15em',renk:'var(--koyu-yazi)'})+
   '<span class="dug ince">'+k(b.dugme||'Görüşme planla')+'</span></div>'+
   (b.etiket?'<div class="hap">'+k(b.etiket)+'</div>':'')+
   '<h4>'+bas+'</h4><p>'+k(b.aciklama||'')+'</p>'+
   '<a class="dug">'+k(b.dugme||'Ücretsiz görüşme planla')+'</a></div></div>';
}

/* ---------- on iki pano ---------- */
function pano(no,ad,govde,koyu){
  return '<section class="pano'+(koyu?' koyu':'')+'"><span class="no">'+no+' · '+k(ad)+'</span>'+govde+'</section>';
}
var P=[];

P.push(pano('01','Kapak',
 '<div style="padding:26px 0 10px">'+logo({boy:44,renk:'var(--koyu-yazi)'})+
 '<p style="color:#AEB6C0;margin:20px 0 0;font-size:17px;max-width:46ch">'+k(M.konum||'')+'</p>'+
 '<p style="color:#7D858F;margin-top:26px;font-size:13px">'+k(M.sehir||'')+' · '+k(M.yil||'')+
 ' · sürüm 1</p></div>', true));

P.push(pano('02','Marka temeli',
 '<h2>'+k(M.konum||'')+'</h2>'+
 '<p style="color:var(--soluk)">Bu cümle sitede, profilde ve kartvizitte aynen durur. Değişirse üçünde birden değişir.</p>'+
 '<div class="gr g2" style="margin-top:22px">'+
 '<div><h3>Biz buyuz</h3><ul class="im">'+(M.biz||[]).map(function(x){return '<li>'+k(x)+'</li>'}).join('')+'</ul></div>'+
 '<div><h3>Biz bu değiliz</h3><ul class="im yok">'+(M.degil||[]).map(function(x){return '<li>'+k(x)+'</li>'}).join('')+'</ul></div>'+
 '</div>'));

P.push(pano('03','Logo ve alternatifleri',
 '<div class="gr g4">'+
 '<figure class="kk" style="margin:0"><div class="kutu">'+logo({boy:22})+'</div><figcaption>Yatay, açık zemin. Sitenin üst çubuğu, belgeler.</figcaption></figure>'+
 '<figure class="kk" style="margin:0"><div class="kutu k">'+logo({boy:22,renk:'var(--koyu-yazi)'})+'</div><figcaption>Yatay, koyu zemin. Açılış bandı, kapanış.</figcaption></figure>'+
 '<figure class="kk" style="margin:0"><div class="kutu">'+logo({boy:19,dikey:true})+'</div><figcaption>Dikey. Kare alanlar, damga, kapak.</figcaption></figure>'+
 '<figure class="kk" style="margin:0"><div class="kutu">'+logo({boy:22,tek:true})+'</div><figcaption>Tek renk. Baskı, faks, kaşe.</figcaption></figure>'+
 '</div>'+
 '<div class="gr g4" style="margin-top:16px">'+
 '<figure class="kk" style="margin:0"><div class="kutu"><span class="marka" style="font-size:40px">'+
   '<span class="sm">'+k(KISA)+'</span></span></div><figcaption>Sembol. Profil görseli, favicon, küçük alan.</figcaption></figure>'+
 '<figure class="kk" style="margin:0"><div class="kutu">'+logo({boy:11})+'</div><figcaption>En küçük hal. 11 piksel altına inmez.</figcaption></figure>'+
 '<figure class="kk" style="margin:0"><div class="kutu">'+logo({boy:22,sembolsuz:true})+'</div><figcaption>Sembolsüz. Sembol zaten yanda duruyorsa.</figcaption></figure>'+
 '<figure class="kk" style="margin:0"><div class="kutu" style="background:var(--vurgu)">'+
   logo({boy:22,renk:'var(--vurgu-yazi)',tek:true})+'</div><figcaption>Vurgu zemin üstünde.</figcaption></figure>'+
 '</div>'));

P.push(pano('04','Logo kuralları ve yanlış kullanım',
 '<div class="gr g2"><div>'+
 '<h3>Kurallar</h3><ul class="im">'+
 '<li>Çevresinde en az sembol yüksekliği kadar boşluk kalır.</li>'+
 '<li>En küçük hali 11 piksel; altına inilmez.</li>'+
 '<li>Fotoğraf üstünde yalnız tek renk hali kullanılır.</li>'+
 '<li>Yalnız iki zemin: açık ve koyu. Üçüncü zemin yok.</li>'+
 '<li>Yazı tipi değiştirilmez, harf aralığı oynatılmaz.</li>'+
