<!doctype html>
<html lang="tr" data-yon="saglam">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FounderOS tanıtım sayfası</title>
<meta name="description" content="">
<!--FOUNDEROS-FONT-->
<!--FOUNDEROS-FOTO-->
<style>
/* FounderOS tanıtım sayfası şablonu, ikinci nesil.
   Bu dosya elle düzenlenmez. FounderOS yalnız aşağıdaki veri bloğunu doldurur;
   biçim, yerleşim ve ölçüler burada sabittir. Yazı tipleri ve nişin açılış
   fotoğrafı site-uret.py ile yukarıdaki iki işarete gömülür. */

:root{
  --zemin:#ffffff; --yazi:#111418; --soluk:#5b6470; --cizgi:#e6e8ec;
  --koyu:#0d0f12; --koyu-yazi:#f4f5f7; --koyu-soluk:#a2a9b4;
  --vurgu:#c8a465; --vurgu-yazi:#14161a; --iyi:#2fbf71;
  --yuvarlak:14px; --olcu:1180px; --dar:720px;
  --baslik:'Georgia',serif; --govde:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:74px}
body{margin:0;background:var(--zemin);color:var(--yazi);font:400 17px/1.65 var(--govde);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
::selection{background:var(--vurgu);color:var(--vurgu-yazi)}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:3px;border-radius:4px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.kap{width:100%;max-width:var(--olcu);margin:0 auto;padding:0 24px}
.dar{max-width:var(--dar)}
section{padding:clamp(64px,9vw,120px) 0;position:relative}
.gizli{display:none !important}

/* --- yazı ölçeği --- */
h1,h2,h3{font-family:var(--baslik);font-weight:700;letter-spacing:-.025em;margin:0}
h1{font-size:clamp(38px,5.4vw,66px);line-height:1.04;margin-bottom:22px}
h2{font-size:clamp(28px,4vw,46px);line-height:1.12}
h2+.iri,h2+p{margin-top:16px}
h3{font-size:clamp(18px,2vw,22px);line-height:1.3;letter-spacing:-.01em}
p{margin:0 0 1.05em}
.iri{font-size:clamp(18px,2.1vw,21px);line-height:1.55;color:var(--soluk)}
.vur{color:var(--vurgu)}
.kucuk{font-size:14px;line-height:1.5;color:var(--soluk)}

/* bölüm numarası: "01 — DERT" */
.no{display:flex;align-items:center;gap:12px;font:600 12.5px/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--vurgu);margin-bottom:22px}
.no::after{content:"";flex:0 0 40px;height:1px;background:currentColor;opacity:.6}
.no:empty{display:none}

/* --- koyu bant --- */
.bant{background:var(--koyu);color:var(--koyu-yazi);position:relative;overflow:hidden}
.bant::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -20%, color-mix(in srgb,var(--vurgu) 16%, transparent), transparent 62%),
    radial-gradient(80% 60% at 100% 100%, color-mix(in srgb,var(--vurgu) 8%, transparent), transparent 58%)}
.bant::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(color-mix(in srgb,var(--koyu-yazi) 5%,transparent) 1px,transparent 1px),
                   linear-gradient(90deg,color-mix(in srgb,var(--koyu-yazi) 5%,transparent) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 0%,#000,transparent 75%);
  mask-image:radial-gradient(70% 60% at 50% 0%,#000,transparent 75%)}
.bant .kap{position:relative;z-index:1}
.bant .iri,.bant .kucuk{color:var(--koyu-soluk)}
.bant .cizgili{border-color:color-mix(in srgb,var(--koyu-yazi) 12%,transparent)}

/* --- etiket hapı --- */
.hap{display:inline-flex;align-items:center;gap:9px;font:500 13.5px/1.35 var(--govde);letter-spacing:.02em;
  padding:9px 15px;max-width:100%;border-radius:999px;border:1px solid color-mix(in srgb,var(--koyu-yazi) 18%,transparent);
  color:var(--koyu-yazi);background:color-mix(in srgb,var(--koyu) 55%,transparent);backdrop-filter:blur(6px);margin-bottom:26px}
.hap::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--iyi);box-shadow:0 0 0 4px color-mix(in srgb,var(--iyi) 25%,transparent)}

/* --- düğme --- */
.dug{display:inline-flex;align-items:center;gap:9px;font:600 16px/1 var(--govde);
  padding:18px 30px;border-radius:var(--yuvarlak);border:0;cursor:pointer;text-decoration:none;
  background:var(--vurgu);color:var(--vurgu-yazi);transition:transform .12s ease,filter .12s ease,box-shadow .2s ease;
  box-shadow:0 10px 30px -12px color-mix(in srgb,var(--vurgu) 70%,transparent)}
.dug::after{content:"→";font-weight:500;transition:transform .15s ease}
.dug:hover{filter:brightness(1.06)}
.dug:hover::after{transform:translateX(3px)}
.dug:active{transform:translateY(1px)}
.dug.ikinci{background:transparent;color:inherit;border:1px solid color-mix(in srgb,currentColor 28%,transparent);box-shadow:none}
.dug.ikinci::after{content:none}
.dugler{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 18px}

/* --- üst çubuk --- */
header{position:fixed;top:0;left:0;right:0;z-index:40;color:var(--koyu-yazi);
  transition:background .25s ease,border-color .25s ease,box-shadow .25s ease;border-bottom:1px solid transparent}
header.dolu{background:color-mix(in srgb,var(--koyu) 86%,transparent);backdrop-filter:saturate(150%) blur(12px);
  border-bottom-color:color-mix(in srgb,var(--koyu-yazi) 10%,transparent)}
header .kap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:20px}
.marka{display:flex;align-items:center;gap:11px;font:700 17px/1 var(--baslik);letter-spacing:-.01em;text-decoration:none}
.marka img{height:30px;width:auto}
nav.menu{display:flex;gap:26px;font:500 14.5px/1 var(--govde)}
nav.menu a{text-decoration:none;opacity:.78;transition:opacity .15s}
nav.menu a:hover{opacity:1}
header .dug{padding:12px 20px;font-size:14.5px;box-shadow:none}
.serit-yeri{height:0}
body.seritli .serit-yeri{height:44px}

/* --- sonuç şeridi --- */
.serit{background:color-mix(in srgb,var(--vurgu) 16%,var(--koyu));color:var(--koyu-yazi);
  text-align:center;padding:12px 22px;font-size:14.5px;position:fixed;top:0;left:0;right:0;z-index:41;height:44px;
  display:flex;align-items:center;justify-content:center;gap:10px}
.serit b{color:var(--vurgu)}
body.seritli header{top:44px}

/* --- açılış: tam ekran, fotoğraf üstüne --- */
#b-acilis{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0;
  background:var(--koyu);color:var(--koyu-yazi);position:relative;overflow:hidden}
.foto{position:absolute;inset:0;background:var(--foto,none) center/cover no-repeat;
  filter:saturate(.7) contrast(1.05);opacity:.001;transition:opacity 1.2s ease;transform:scale(1.04)}
.foto.var{opacity:.62;animation:yaklas 14s ease-out forwards}
@keyframes yaklas{to{transform:scale(1)}}
.ortu{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg, color-mix(in srgb,var(--koyu) 62%,transparent) 0%, color-mix(in srgb,var(--koyu) 22%,transparent) 40%, color-mix(in srgb,var(--koyu) 78%,transparent) 78%, var(--koyu) 100%),
    linear-gradient(90deg, color-mix(in srgb,var(--koyu) 78%,transparent) 0%, color-mix(in srgb,var(--koyu) 30%,transparent) 55%, transparent 100%)}
.ortu::after{content:"";position:absolute;inset:0;opacity:.28;
  background-image:linear-gradient(color-mix(in srgb,var(--koyu-yazi) 6%,transparent) 1px,transparent 1px),
                   linear-gradient(90deg,color-mix(in srgb,var(--koyu-yazi) 6%,transparent) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(60% 50% at 70% 30%,#000,transparent 80%);
  mask-image:radial-gradient(60% 50% at 70% 30%,#000,transparent 80%)}
.acilis{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,72px);
  align-items:end;padding-top:calc(96px + var(--serit-yer,0px));padding-bottom:40px}
.acilis .metin{padding-bottom:10px}
.acilis .iri{max-width:56ch;color:color-mix(in srgb,var(--koyu-yazi) 78%,transparent)}
.guven{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;color:var(--koyu-soluk);max-width:60ch}
.guven::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--vurgu);flex:0 0 auto;margin-top:8px}

/* kelime kelime beliren başlık */
h1 .k{display:inline-block;opacity:0;transform:translateY(.35em);animation:bel .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes bel{to{opacity:1;transform:none}}

/* sayı şeridi */
.sayilar{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:0;
  border-top:1px solid color-mix(in srgb,var(--koyu-yazi) 14%,transparent);margin-top:34px}
.sayi{padding:26px 26px 30px 0;border-right:1px solid color-mix(in srgb,var(--koyu-yazi) 10%,transparent)}
.sayi:last-child{border-right:0}
.sayi + .sayi{padding-left:26px}
.sayi b{display:block;font:700 clamp(30px,3.6vw,46px)/1 var(--baslik);letter-spacing:-.03em;margin-bottom:8px}
.sayi span{font-size:14px;color:var(--koyu-soluk);line-height:1.45;display:block;max-width:24ch}

/* --- telefon çerçevesi --- */
.tel{width:100%;max-width:320px;margin-inline:auto;border-radius:32px;padding:11px;
  background:color-mix(in srgb,var(--koyu-yazi) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--koyu-yazi) 16%,transparent);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9)}
.tel-ic{background:var(--koyu);color:var(--koyu-yazi);border-radius:24px;overflow:hidden}
.tel-ust{display:flex;align-items:center;gap:9px;padding:13px 15px;
  border-bottom:1px solid color-mix(in srgb,var(--koyu-yazi) 10%,transparent);font-size:14px}
.tel-ust .nokta{width:26px;height:26px;border-radius:50%;background:var(--vurgu);color:var(--vurgu-yazi);
  display:grid;place-items:center;font:700 12px/1 var(--govde);flex:0 0 auto}
.tel-saat{margin-left:auto;color:var(--koyu-soluk);font-size:12.5px}
.tel-govde{padding:14px 12px 16px;display:flex;flex-direction:column;gap:8px;min-height:230px}
.tel.uzun .tel-govde{min-height:380px}
.bal{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.42;
  opacity:0;transform:translateY(8px);animation:gel .45s ease forwards}
.bal.gelen{align-self:flex-start;background:color-mix(in srgb,var(--koyu-yazi) 12%,transparent);border-bottom-left-radius:5px}
.bal.giden{align-self:flex-end;background:var(--vurgu);color:var(--vurgu-yazi);border-bottom-right-radius:5px}
@keyframes gel{to{opacity:1;transform:none}}
.tel-alt{display:flex;align-items:center;gap:8px;padding:10px 12px 12px;font-size:12.5px;color:var(--koyu-soluk);
  border-top:1px solid color-mix(in srgb,var(--koyu-yazi) 8%,transparent)}
.tel-alt b{color:var(--iyi);font-weight:600}

/* --- görünür olunca beliren bölüm içerikleri --- */
.bel{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.bel.gor{opacity:1;transform:none}

/* --- video --- */
.video{position:relative;border-radius:var(--yuvarlak);overflow:hidden;aspect-ratio:16/9;background:#000;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}

/* --- dert --- */
.cekme{margin:34px 0;padding:6px 0 6px 26px;border-left:3px solid var(--vurgu);
  font-family:var(--baslik);font-size:clamp(22px,2.8vw,30px);line-height:1.3;letter-spacing:-.01em}
.cekme small{display:block;margin-top:10px;font:500 13.5px/1.4 var(--mono);color:var(--soluk);letter-spacing:.04em}

/* --- bedel --- */
.bedel{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,72px);align-items:center}
.hesap{list-style:none;margin:0;padding:0;border-top:1px solid var(--cizgi)}
.hesap li{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:20px 0;border-bottom:1px solid var(--cizgi)}
.hesap li span{color:var(--soluk);font-size:16px}
.hesap li b{font:700 clamp(20px,2.4vw,28px)/1.1 var(--baslik);letter-spacing:-.02em;text-align:right;white-space:nowrap}
.hesap li:last-child b{color:var(--vurgu)}

/* --- ürün görüntüsü: haftalık takvim --- */
.urun{border-radius:calc(var(--yuvarlak) + 6px);background:var(--koyu);color:var(--koyu-yazi);padding:22px;
  border:1px solid color-mix(in srgb,var(--koyu-yazi) 12%,transparent);box-shadow:0 40px 100px -40px rgba(0,0,0,.8)}
.urun-ust{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.urun-ust .ad{font:600 14px/1 var(--mono);letter-spacing:.06em;color:var(--koyu-soluk)}
.doluluk{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--mono);letter-spacing:.08em;
  padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--iyi) 16%,transparent);color:var(--iyi)}
.gunler{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.gun{background:color-mix(in srgb,var(--koyu-yazi) 5%,transparent);border-radius:12px;padding:12px 10px;min-height:200px}
.gun h4{margin:0 0 10px;font:600 12px/1 var(--mono);letter-spacing:.1em;color:var(--koyu-soluk)}
.is{border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.3;margin-bottom:7px;
  background:color-mix(in srgb,var(--koyu-yazi) 9%,transparent);border-left:3px solid color-mix(in srgb,var(--koyu-yazi) 30%,transparent)}
.is.sistem{background:color-mix(in srgb,var(--vurgu) 20%,transparent);border-left-color:var(--vurgu)}
.is.bos{background:transparent;border:1px dashed color-mix(in srgb,var(--koyu-yazi) 22%,transparent);color:var(--koyu-soluk)}
.is small{display:block;font:500 11.5px/1 var(--mono);color:var(--koyu-soluk);margin-top:4px}
.is.sistem small{color:color-mix(in srgb,var(--koyu-yazi) 70%,transparent)}
.urun-alt{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:16px;font-size:13px;color:var(--koyu-soluk);align-items:center}
.lej{display:inline-flex;align-items:center;gap:7px}
.lej i{width:10px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--koyu-yazi) 30%,transparent)}
.lej.sistem i{background:var(--vurgu)}
.rozetler{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rozet{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--koyu-yazi) 6%,transparent);font-size:13px}
.rozet small{display:block;font:600 11px/1 var(--mono);letter-spacing:.1em;color:var(--koyu-soluk);margin-bottom:6px}
.rozet b{color:var(--iyi);font-weight:600}
.urun-bolum{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,5vw,64px);align-items:center}
.urun-bolum>*,.grafik>*,.kanal,.acilis>*,.bedel>*,.kim>*,.gorusme-ic>*{min-width:0}

/* --- üç an --- */
.anlar{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.an .tel{max-width:none}
.an p{margin:16px 6px 0;font-size:15.5px;color:var(--soluk)}

/* --- kanallar --- */
.kanallar{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.kanal{border:1px solid var(--cizgi);border-radius:calc(var(--yuvarlak) + 4px);padding:24px;background:var(--zemin);display:flex;flex-direction:column}
.kanal h3{margin-bottom:8px}
.kanal > p{color:var(--soluk);font-size:15px;margin-bottom:18px;min-height:3em}
.ekran{border-radius:16px;background:var(--koyu);color:var(--koyu-yazi);padding:14px;font-size:13.5px;line-height:1.4;
  margin-bottom:18px;min-height:250px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.ekran .ust{display:flex;justify-content:space-between;font:500 11.5px/1 var(--mono);color:var(--koyu-soluk);letter-spacing:.04em}
.ekran .num{font:700 20px/1.1 var(--baslik);letter-spacing:-.01em;margin-top:6px}
.ekran .alt-yazi{font-size:12.5px;color:var(--koyu-soluk)}
.ekran .olay{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:9px;background:color-mix(in srgb,var(--koyu-yazi) 8%,transparent)}
.ekran .olay.sistem{background:color-mix(in srgb,var(--vurgu) 20%,transparent)}
.ekran .olay.iyi{background:color-mix(in srgb,var(--iyi) 16%,transparent);color:var(--iyi);font-weight:600}
.ekran .olay span:last-child{color:var(--koyu-soluk);font:500 11.5px/1.4 var(--mono);white-space:nowrap}
.ekran .olay.iyi span:last-child{color:inherit}
.ekran .form{background:color-mix(in srgb,var(--koyu-yazi) 6%,transparent);border-radius:10px;padding:11px}
.ekran .form .b{font-weight:600;margin-bottom:2px}
.ekran .form .a{font-size:12px;color:var(--koyu-soluk);margin-bottom:9px}
.ekran .alan{border:1px solid color-mix(in srgb,var(--koyu-yazi) 16%,transparent);border-radius:7px;padding:7px 9px;font-size:12.5px;margin-bottom:6px;color:color-mix(in srgb,var(--koyu-yazi) 80%,transparent)}
.ekran .gonder{background:var(--koyu-yazi);color:var(--koyu);text-align:center;border-radius:7px;padding:7px;font-weight:600;font-size:12.5px}
.ekran .bal{max-width:88%;font-size:13px}
.ekran .son{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:9px;
  border-top:1px solid color-mix(in srgb,var(--koyu-yazi) 10%,transparent);font-size:12.5px}
.ekran .son b{color:var(--iyi);font-weight:600}
.ekran .son span:last-child{font:600 12px/1 var(--mono);color:var(--koyu-soluk)}
.kiyas{display:grid;gap:10px;margin-top:auto}
.kiyas div{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px;line-height:1.45}
.kiyas div i{font-style:normal;font-weight:700;text-align:center;line-height:1.5}
.kiyas .kotu{color:var(--soluk)}
.kiyas .kotu i{color:#d0523a}
.kiyas .iyi i{color:var(--iyi)}
.kanal-son{margin-top:32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding:24px 28px;border-radius:var(--yuvarlak);background:color-mix(in srgb,var(--vurgu) 7%,var(--zemin));border:1px solid color-mix(in srgb,var(--vurgu) 30%,transparent)}
.kanal-son p{margin:0;max-width:60ch;font-size:16.5px}

/* --- yanıt süresi grafiği --- */
.grafik{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);align-items:start}
.cubuklar{display:grid;gap:12px}
.cubuk{display:grid;grid-template-columns:92px 1fr 48px;align-items:center;gap:12px;font-size:14px}
.cubuk .et{color:var(--koyu-soluk);font:500 12.5px/1.2 var(--mono)}
.cubuk .ray{height:14px;border-radius:7px;background:color-mix(in srgb,var(--koyu-yazi) 8%,transparent);overflow:hidden}
.cubuk .ray i{display:block;height:100%;width:0;border-radius:7px;background:var(--vurgu);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.cubuk:first-child .ray i{background:var(--iyi)}
.cubuk .de{text-align:right;font:700 15px/1 var(--baslik)}
.buyuk-sayilar{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.buyuk{padding:18px 18px 16px;border-radius:var(--yuvarlak);background:color-mix(in srgb,var(--koyu-yazi) 5%,transparent);border:1px solid color-mix(in srgb,var(--koyu-yazi) 10%,transparent)}
.buyuk b{display:block;font:700 clamp(22px,2.6vw,32px)/1 var(--baslik);letter-spacing:-.02em;margin-bottom:8px}
.buyuk span{font-size:13px;color:var(--koyu-soluk);line-height:1.4;display:block}
.maddeler{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px;margin-top:28px}
.madde h3{font-size:16.5px;margin-bottom:4px}
.madde p{font-size:14.5px;color:var(--koyu-soluk);margin:0}

/* --- süreç çizelgesi --- */
.surec{position:relative;display:grid;gap:0;margin-top:10px}
.surec::before{content:"";position:absolute;left:11px;top:16px;bottom:16px;width:1px;background:color-mix(in srgb,var(--koyu-yazi) 16%,transparent)}
.adim{position:relative;display:grid;grid-template-columns:52px 220px 1fr;gap:18px;padding:22px 0;align-items:start}
.adim + .adim{border-top:1px solid color-mix(in srgb,var(--koyu-yazi) 9%,transparent)}
.adim::before{content:"";position:absolute;left:6px;top:31px;width:11px;height:11px;border-radius:50%;background:var(--vurgu);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--vurgu) 18%,transparent)}
.adim .et{grid-column:2;font:600 12px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--vurgu);padding-top:5px}
.adim .ic{grid-column:3}
.adim h3{margin-bottom:6px}
.adim p{margin:0;color:var(--koyu-soluk);max-width:60ch}

/* --- neden --- */
.kars{border-top:1px solid var(--cizgi)}
.kars .satir{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,3vw,44px);padding:20px 0;border-bottom:1px solid var(--cizgi)}
.kars .sol{color:var(--soluk)}
.kars .sag{font-weight:600}
.kars .sol::before,.kars .sag::before{display:block;font:600 11px/1 var(--mono);letter-spacing:.12em;margin-bottom:8px}
.kars .sol::before{content:"BUGÜN";color:#d0523a}
.kars .sag::before{content:"SİSTEMLE";color:var(--iyi)}

/* --- yorumlar ve vakalar --- */
.kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
.kart{border:1px solid var(--cizgi);border-radius:var(--yuvarlak);padding:26px;background:var(--zemin)}
.kart p{font-size:17px}
.kart .ad{margin-top:16px;font-size:14px;color:var(--soluk);font-family:var(--mono)}
.vaka{border:1px solid var(--cizgi);border-radius:var(--yuvarlak);padding:26px;margin-bottom:16px}
.vaka dl{display:grid;grid-template-columns:104px 1fr;gap:9px 18px;margin:14px 0 0;font-size:15.5px}
.vaka dt{font-weight:600;color:var(--vurgu)}
.vaka dd{margin:0}

/* --- kim --- */
.kim{display:grid;grid-template-columns:340px 1fr;gap:clamp(28px,5vw,64px);align-items:center}
.kim-kart{position:relative;border-radius:calc(var(--yuvarlak) + 6px);overflow:hidden;aspect-ratio:4/5;background:var(--koyu)}
.kim-kart img{width:100%;height:100%;object-fit:cover}
.kim-kart .isim{position:absolute;left:0;right:0;bottom:0;padding:18px 20px;color:var(--koyu-yazi);
  background:linear-gradient(transparent,color-mix(in srgb,var(--koyu) 92%,transparent));font:600 15px/1.3 var(--govde)}
.kim-kart .isim small{display:block;font:500 12px/1.3 var(--mono);color:var(--koyu-soluk);margin-top:3px;letter-spacing:.04em}
.kim .ic p:first-of-type{font-size:clamp(19px,2.2vw,23px);line-height:1.45;font-family:var(--baslik);letter-spacing:-.01em}

/* --- güvence --- */
.guvence{border:1px solid color-mix(in srgb,var(--vurgu) 50%,transparent);border-radius:calc(var(--yuvarlak) + 4px);
  padding:clamp(26px,4vw,44px);background:color-mix(in srgb,var(--vurgu) 6%,var(--zemin))}
.guvence p:last-child{margin-bottom:0}

/* --- sorular --- */
.soru{border-bottom:1px solid var(--cizgi)}
.soru summary{list-style:none;cursor:pointer;padding:22px 44px 22px 0;position:relative;
  font-family:var(--baslik);font-size:clamp(17px,2vw,20px);font-weight:600;letter-spacing:-.01em}
.soru summary::-webkit-details-marker{display:none}
.soru summary::after{content:"+";position:absolute;right:4px;top:50%;transform:translateY(-50%);
  font:400 28px/1 var(--govde);color:var(--vurgu);transition:transform .2s}
.soru[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.soru p{margin:0 0 22px;color:var(--soluk);max-width:64ch}

/* --- takvim --- */
.takvim{border-radius:var(--yuvarlak);overflow:hidden;border:1px solid color-mix(in srgb,var(--koyu-yazi) 14%,transparent);min-height:640px;background:var(--zemin)}
.takvim iframe{width:100%;height:680px;border:0;display:block}
.gorusme-ic{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);align-items:center}

/* --- son çağrı --- */
.son-cagri h2{font-size:clamp(32px,5vw,58px)}

/* --- alt bölüm --- */
footer{border-top:1px solid color-mix(in srgb,var(--koyu-yazi) 12%,transparent);
  padding:34px 0;font-size:14.5px;color:var(--koyu-soluk)}
footer .kap{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;justify-content:space-between}
footer a{text-decoration:none}
footer a:hover{color:var(--vurgu)}

/* --- sabit düğmeler --- */
.yuzen{position:fixed;right:22px;bottom:22px;z-index:30;width:58px;height:58px;border-radius:50%;
  background:var(--vurgu);color:var(--vurgu-yazi);display:grid;place-items:center;text-decoration:none;
  box-shadow:0 18px 40px -14px color-mix(in srgb,var(--vurgu) 90%,transparent);transition:transform .15s}
.yuzen:hover{transform:translateY(-2px)}
.yuzen svg{width:24px;height:24px}
.sabit{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--koyu) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid color-mix(in srgb,var(--koyu-yazi) 12%,transparent);display:none}
.sabit .dug{width:100%;justify-content:center}

/* --- 1024 altı --- */
@media (max-width:1024px){
  nav.menu{display:none}
  .anlar,.kanallar{grid-template-columns:1fr 1fr}
  .adim{grid-template-columns:52px 1fr}
  .adim .et{grid-column:2}
  .adim .ic{grid-column:2}
}
/* --- 900 altı --- */
@media (max-width:900px){
  .acilis,.bedel,.kim,.urun-bolum,.grafik,.gorusme-ic{grid-template-columns:1fr}
  .acilis{padding-top:110px}
  .acilis .tel{max-width:300px}
  .kim-kart{max-width:300px}
  .sayilar{grid-template-columns:1fr 1fr 1fr}
  .sayi{padding:18px 12px 20px 0}
  .sayi + .sayi{padding-left:12px}
  .sayi span{font-size:12.5px}
  header .dug{display:none}
  .sabit{display:block}
  .yuzen{display:none}
  body{padding-bottom:78px}
  .kars .satir{grid-template-columns:1fr;gap:12px}
  .vaka dl{grid-template-columns:1fr}
  .gunler{grid-template-columns:repeat(5,minmax(112px,1fr));overflow-x:auto;padding-bottom:6px}
  .maddeler,.buyuk-sayilar,.rozetler{grid-template-columns:1fr}
}
@media (max-width:640px){
  .anlar,.kanallar{grid-template-columns:1fr}
  .an .tel{max-width:300px}
  .sayilar{grid-template-columns:1fr}
  .sayi{border-right:0;border-bottom:1px solid color-mix(in srgb,var(--koyu-yazi) 10%,transparent);padding:16px 0}
  .sayi + .sayi{padding-left:0}
  .sayi:last-child{border-bottom:0}
  .cubuk{grid-template-columns:76px 1fr 42px}
  .hesap li b{white-space:normal;font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  h1 .k,.bal,.bel{animation:none;opacity:1;transform:none;transition:none}
  .foto.var{animation:none;transform:none}
  html{scroll-behavior:auto}
}
@media print{header,.sabit,.yuzen,.takvim,.foto{display:none}#b-acilis{min-height:0}}
</style>

<script>
/*FOUNDEROS-SITE*/
(function(){
var S = window.SITE || {};
function $(i){return document.getElementById(i)}
function kac(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function yaz(i,v){var e=$(i);if(e)e.textContent=(v==null?'':v)}
function html(i,v){var e=$(i);if(e)e.innerHTML=v}
function ac(i){var e=$(i);if(e)e.classList.remove('gizli')}
function dolu(x){return x!=null && x!=='' && !(Array.isArray(x)&&x.length===0)}
function no(id,ad){var e=$('no-'+id);if(!e)return;e.setAttribute('data-ad',ad)}

/* --- kitin değerleri --- */
var r = S.renk||{}, f = S.yazi_tipi||{};
var kok = document.documentElement.style;
if(r.zemin)kok.setProperty('--zemin',r.zemin);
if(r.yazi)kok.setProperty('--yazi',r.yazi);
if(r.soluk)kok.setProperty('--soluk',r.soluk);
if(r.cizgi)kok.setProperty('--cizgi',r.cizgi);
if(r.koyu)kok.setProperty('--koyu',r.koyu);
if(r.koyu_yazi)kok.setProperty('--koyu-yazi',r.koyu_yazi);
if(r.koyu_soluk)kok.setProperty('--koyu-soluk',r.koyu_soluk);
if(r.vurgu)kok.setProperty('--vurgu',r.vurgu);
if(r.vurgu_yazi)kok.setProperty('--vurgu-yazi',r.vurgu_yazi);
if(S.yuvarlak)kok.setProperty('--yuvarlak',S.yuvarlak);
if(f.baslik)kok.setProperty('--baslik',f.baslik);
if(f.govde)kok.setProperty('--govde',f.govde);
if(S.yon)document.documentElement.setAttribute('data-yon',S.yon);

var is = S.is||{};
document.title = (is.ad||'')+(is.ad&&is.sehir?' · '+is.sehir:'');
var md = document.querySelector('meta[name=description]');
if(md && S.acilis && S.acilis.aciklama) md.setAttribute('content', S.acilis.aciklama);

/* --- açılış fotoğrafı: site-uret.py --foto değişkenini gömer; yoksa dokulu koyu zemin kalır --- */
var fotoVar = getComputedStyle(document.documentElement).getPropertyValue('--foto').trim();
if(fotoVar && fotoVar!=='none'){$('foto').classList.add('var')}

/* --- üst çubuk ve marka --- */
html('marka',(is.logo?'<img src="'+kac(is.logo)+'" alt="">':'')+'<span>'+kac(is.ad||'')+'</span>');
var dugMetni = (S.acilis&&S.acilis.dugme)||'Ücretsiz görüşme planla';
['ust-dug','ana-dug','son-dug','sabit-dug'].forEach(function(i){yaz(i,dugMetni)});
window.addEventListener('scroll',function(){$('ust').classList.toggle('dolu',window.scrollY>40)},{passive:true});

/* --- sonuç şeridi: yalnız gerçek müşteri sonucu varsa --- */
if(dolu(S.serit)){html('serit',S.serit);ac('serit');document.body.classList.add('seritli');kok.setProperty('--serit-yer','44px')}

/* --- açılış --- */
var a = S.acilis||{};
yaz('etiket',a.etiket); if(!dolu(a.etiket))$('etiket').classList.add('gizli');
(function(){
  var b=a.baslik||'', v=a.vurgu||'';
  var kelimeler=b.split(/\s+/).filter(Boolean), vk=v?v.split(/\s+/).filter(Boolean):[];
  var out=[], i=0;
  while(i<kelimeler.length){
    var esl = vk.length && kelimeler.slice(i,i+vk.length).join(' ').replace(/[.,!?]+$/,'')===v.replace(/[.,!?]+$/,'');
    if(esl){ vk.forEach(function(_,j){out.push('<span class="k vur" style="animation-delay:'+((i+j)*0.09+0.1).toFixed(2)+'s">'+kac(kelimeler[i+j])+'</span>')}); i+=vk.length }
    else { out.push('<span class="k" style="animation-delay:'+(i*0.09+0.1).toFixed(2)+'s">'+kac(kelimeler[i])+'</span>'); i++ }
  }
  html('baslik',out.join(' '));
})();
yaz('acik',a.aciklama);
yaz('guven',a.guven); if(!dolu(a.guven))$('guven').classList.add('gizli');
if(dolu(a.ikinci_dugme)&&dolu(S.vakalar)){yaz('ikinci-dug',a.ikinci_dugme);ac('ikinci-dug')}

/* --- üç sayı: kaynaklı olanlar --- */
if(dolu(S.sayilar)){
  html('sayilar',S.sayilar.slice(0,3).map(function(x){return '<div class="sayi"><b>'+kac(x.deger)+'</b><span>'+kac(x.aciklama)+'</span></div>'}).join(''));
  ac('sayilar');
}

/* --- telefon çerçevesi --- */
function telefon(kon,baslikMetni,saat,altSatir){
  if(!dolu(kon))return '';
  var h='<div class="tel-ic"><div class="tel-ust"><span class="nokta">'+
    kac((baslikMetni||'?').trim().charAt(0).toLocaleUpperCase('tr'))+'</span><span>'+kac(baslikMetni||'')+
    '</span><span class="tel-saat">'+kac(saat||'')+'</span></div><div class="tel-govde">';
  kon.forEach(function(b,i){
    h+='<div class="bal '+(b.kim==='sistem'?'giden':'gelen')+'" style="animation-delay:'+(i*0.22+0.15).toFixed(2)+'s">'+kac(b.metin)+'</div>';
  });
  h+='</div>';
  if(dolu(altSatir))h+='<div class="tel-alt"><b>✓</b><span>'+kac(altSatir)+'</span></div>';
  return h+'</div>';
}
var kon = S.konusma||{};
html('tel1', telefon(kon.baloncuklar, kon.isletme, kon.saat, kon.sonuc));

/* --- video --- */
var v = S.video||{};
if(dolu(v.gomme)){yaz('video-baslik',v.baslik);yaz('video-acik',v.aciklama);html('video',v.gomme);ac('b-video')}

/* --- dert --- */
var d = S.dert||{};
yaz('dert-baslik',d.baslik);
html('dert',(d.paragraflar||[]).map(function(p,i){
  var c = d.cekme ? '<div class="cekme">'+kac(d.cekme)+(d.cekme_kaynak?'<small>'+kac(d.cekme_kaynak)+'</small>':'')+'</div>' : '';
  return (d.cekme && i===d.cekme_sonra) ? '<p>'+kac(p)+'</p>'+c : '<p>'+kac(p)+'</p>';
}).join(''));

/* --- bedel --- */
var b = S.bedel||{};
if(dolu(b.satirlar)){
  html('hesap',b.satirlar.map(function(s){return '<li><span>'+kac(s.ad)+'</span><b>'+kac(s.deger)+'</b></li>'}).join(''));
  yaz('bedel-baslik',b.baslik); yaz('bedel-sonuc',b.sonuc); ac('b-bedel');
}

/* --- sistem çalışırken: haftalık takvim --- */
var u = S.urun||{};
if(dolu(u.gunler)){
  yaz('urun-baslik',u.baslik); yaz('urun-acik',u.aciklama);
  html('urun-maddeler',(u.maddeler||[]).map(function(x){return '<p>'+kac(x)+'</p>'}).join(''));
  var h='<div class="urun-ust"><span class="ad">'+kac(u.etiket||'')+'</span>'+(u.doluluk?'<span class="doluluk">'+kac(u.doluluk)+'</span>':'')+'</div><div class="gunler">';
  u.gunler.forEach(function(g){
    h+='<div class="gun"><h4>'+kac(g.ad)+'</h4>';
    (g.isler||[]).forEach(function(x){
      var sinif = x.bos?'is bos':(x.sistem?'is sistem':'is');
      h+='<div class="'+sinif+'">'+kac(x.ad)+(x.saat?'<small>'+kac(x.saat)+'</small>':'')+'</div>';
    });
    h+='</div>';
  });
  h+='</div><div class="urun-alt"><span class="lej sistem"><i></i>'+kac(u.lejant_sistem||'Sistemin yazdığı')+'</span><span class="lej"><i></i>'+kac(u.lejant_mevcut||'Mevcut')+'</span></div>';
  if(dolu(u.rozetler)){
    h+='<div class="rozetler">'+u.rozetler.map(function(x){return '<div class="rozet"><small>'+kac(x.etiket)+'</small><b>'+kac(x.deger)+'</b></div>'}).join('')+'</div>';
  }
  html('urun',h); ac('b-urun');
}

/* --- ne yapıyoruz: üç an --- */
var n = S.ne||{};
yaz('ne-baslik',n.baslik); yaz('ne-acik',n.aciklama);
html('anlar',(n.anlar||[]).map(function(x){
  return '<div class="an"><div class="tel">'+telefon(x.baloncuklar,x.isletme||kon.isletme,x.saat||kon.saat,x.sonuc)+'</div><p>'+kac(x.cumle)+'</p></div>';
}).join(''));
html('kalanlar',(n.kalanlar||[]).map(function(x){return '<p>'+kac(x)+'</p>'}).join(''));

/* --- kanallar --- */
function ekran(k){
  var e=k.ekran||{}, t=k.tip||'';
  var h='<div class="ekran">';
  if(t==='telefon'){
    h+='<div class="ust"><span>'+kac(e.saat||'')+'</span><span>'+kac(e.sinyal||'▂▄▆ 5G')+'</span></div>';
    h+='<div class="num">'+kac(e.numara||'')+'</div><div class="alt-yazi">'+kac(e.altyazi||'')+'</div>';
    (e.olaylar||[]).forEach(function(o){h+='<div class="olay '+(o.tur||'')+'"><span>'+kac(o.ad)+'</span><span>'+kac(o.saat||'')+'</span></div>'});
  } else if(t==='form'){
    h+='<div class="ust"><span>'+kac(e.isletme||'')+'</span><span>'+kac(e.etiket||'Sponsorlu · Form')+'</span></div>';
    h+='<div class="form"><div class="b">'+kac(e.baslik||'')+'</div><div class="a">'+kac(e.aciklama||'')+'</div>';
    (e.alanlar||[]).forEach(function(x){h+='<div class="alan">'+kac(x)+'</div>'});
    h+='<div class="gonder">'+kac(e.dugme||'Gönder')+'</div></div>';
  } else {
    h+='<div class="ust"><span>'+kac(e.isletme||kon.isletme||'')+'</span><span>'+kac(e.durum||'çevrimiçi')+'</span></div>';
    (e.baloncuklar||[]).forEach(function(b,i){h+='<div class="bal '+(b.kim==='sistem'?'giden':'gelen')+'" style="animation-delay:'+(i*0.2+0.1).toFixed(2)+'s">'+kac(b.metin)+'</div>'});
  }
  if(dolu(e.sonuc))h+='<div class="son"><span><b>✓</b> '+kac(e.sonuc)+'</span><span>'+kac(e.sure||'')+'</span></div>';
  return h+'</div>';
}
var kn = S.kanallar||{};
if(dolu(kn.liste)){
  yaz('kanal-baslik',kn.baslik); yaz('kanal-acik',kn.aciklama);
  html('kanallar',kn.liste.map(function(k){
    return '<div class="kanal"><h3>'+kac(k.ad)+'</h3><p>'+kac(k.aciklama||'')+'</p>'+ekran(k)+
      '<div class="kiyas"><div class="kotu"><i>✕</i><span><b>Bugün:</b> '+kac(k.bugun)+'</span></div>'+
      '<div class="iyi"><i>✓</i><span><b>Sistemle:</b> '+kac(k.sistemle)+'</span></div></div></div>';
  }).join(''));
  if(dolu(kn.sonuc)){html('kanal-son','<p>'+kac(kn.sonuc)+'</p><a class="dug" href="#gorusme">'+kac(kn.dugme||dugMetni)+'</a>');ac('kanal-son')}
  ac('b-kanallar');
}

/* --- yanıt süresi grafiği: yalnız kaynaklı rakamla --- */
var gr = S.grafik||{};
if(dolu(gr.cubuklar)){
  yaz('grafik-baslik',gr.baslik); yaz('grafik-acik',gr.aciklama); yaz('grafik-not',gr.not);
  html('buyuk',(gr.sayilar||[]).map(function(x){return '<div class="buyuk"><b>'+kac(x.deger)+'</b><span>'+kac(x.aciklama)+'</span></div>'}).join(''));
  html('cubuklar',gr.cubuklar.map(function(c){return '<div class="cubuk"><span class="et">'+kac(c.etiket)+'</span><span class="ray"><i data-w="'+(Number(c.oran)||0)+'"></i></span><span class="de">'+kac(c.deger)+'</span></div>'}).join(''));
  html('grafik-maddeler',(gr.maddeler||[]).map(function(x){return '<div class="madde"><h3>'+kac(x.baslik)+'</h3><p>'+kac(x.metin)+'</p></div>'}).join(''));
  ac('b-grafik');
}

/* --- nasıl çalışır: süreç çizelgesi --- */
if(dolu(S.nasil)){
  yaz('nasil-baslik',(S.nasil_baslik||'Nasıl çalışır?')); yaz('nasil-acik',S.nasil_aciklama);
  if(!dolu(S.nasil_aciklama))$('nasil-acik').classList.add('gizli');
  html('adimlar',S.nasil.map(function(x,i){
    var et = x.etiket || ('Adım '+(i+1));
    return '<div class="adim"><span class="et">'+kac(et)+'</span><div class="ic"><h3>'+kac(x.baslik)+'</h3><p>'+kac(x.metin)+'</p></div></div>'}).join(''));
  ac('b-nasil');
}

/* --- yorumlar --- */
if(dolu(S.yorumlar)){
  yaz('yorum-baslik',(S.yorum_baslik||'Müşteriler ne diyor'));
  html('yorumlar',S.yorumlar.map(function(y){
    return '<div class="kart"><p>“'+kac(y.metin)+'”</p><div class="ad">'+kac(y.ad)+(y.isletme?' · '+kac(y.isletme):'')+'</div></div>'}).join(''));
  ac('b-yorumlar');
}

/* --- örnek çalışmalar --- */
if(dolu(S.vakalar)){
  yaz('vaka-baslik',(S.vaka_baslik||'Örnek çalışmalar'));
  html('vakalar',S.vakalar.map(function(x){
    return '<div class="vaka"><h3>'+kac(x.baslik)+'</h3><dl>'+
      '<dt>Sorun</dt><dd>'+kac(x.sorun)+'</dd><dt>Çözüm</dt><dd>'+kac(x.cozum)+'</dd><dt>Sonuç</dt><dd>'+kac(x.sonuc)+'</dd></dl></div>'}).join(''));
  ac('b-vakalar');
}

/* --- neden biz --- */
if(dolu(S.neden)){
  yaz('neden-baslik',(S.neden_baslik||'Şu an nasıl yapılıyor?'));
  html('neden',S.neden.map(function(x){return '<div class="satir"><div class="sol">'+kac(x.boyle)+'</div><div class="sag">'+kac(x.biz)+'</div></div>'}).join(''));
  ac('b-neden');
}

/* --- kim --- */
var k = S.kim||{};
yaz('kim-baslik',k.baslik);
html('kim',(k.paragraflar||[]).map(function(p){return '<p>'+kac(p)+'</p>'}).join(''));
if(dolu(k.foto)) html('kim-foto','<div class="kim-kart"><img src="'+kac(k.foto)+'" alt="'+kac(is.kurucu||'')+'"><div class="isim">'+kac(is.kurucu||'')+(k.unvan?'<small>'+kac(k.unvan)+'</small>':'')+'</div></div>');
else { var kk=$('b-kim').querySelector('.kim'); kk.style.gridTemplateColumns='1fr'; kk.classList.add('dar'); }

/* --- güvence --- */
var g = S.guvence||{};
if(dolu(g.paragraflar)){yaz('guvence-baslik',g.baslik);html('guvence',g.paragraflar.map(function(p){return '<p>'+kac(p)+'</p>'}).join(''));ac('b-guvence')}

/* --- sorular --- */
yaz('soru-baslik',(S.soru_baslik||'Sık sorulanlar'));
html('sorular',(S.sorular||[]).map(function(s){return '<details class="soru"><summary>'+kac(s.soru)+'</summary><p>'+kac(s.cevap)+'</p></details>'}).join(''));

/* --- görüşme --- */
var t = S.takvim||{};
yaz('gorusme-baslik',t.baslik||'Görüşme planlayın'); yaz('gorusme-acik',t.aciklama);
if(dolu(t.gomme)){html('takvim',t.gomme);ac('takvim')}
else{
  html('gorusme-dug','<div class="dugler"><a class="dug" href="'+kac(t.baglanti||is.whatsapp||'#')+'">'+kac(dugMetni)+'</a></div>');
  $('gorusme').querySelector('.gorusme-ic').style.gridTemplateColumns='1fr';
}

/* --- yüzen düğme: WhatsApp varsa --- */
if(dolu(is.whatsapp)){$('yuzen').setAttribute('href',is.whatsapp);ac('yuzen')}

/* --- son çağrı ve alt bölüm --- */
yaz('son',S.son||'');
var alt=[];
if(is.ad)alt.push('<span>'+kac(is.ad)+(is.sehir?' · '+kac(is.sehir):'')+'</span>');
var bag=[];
if(is.telefon)bag.push('<a href="tel:'+kac(is.telefon.replace(/\s/g,''))+'">'+kac(is.telefon)+'</a>');
if(is.whatsapp)bag.push('<a href="'+kac(is.whatsapp)+'">WhatsApp</a>');
if(is.eposta)bag.push('<a href="mailto:'+kac(is.eposta)+'">'+kac(is.eposta)+'</a>');
if(bag.length)alt.push('<span>'+bag.join(' &nbsp;·&nbsp; ')+'</span>');
html('alt',alt.join(''));

/* --- bölüm numaraları ve menü: yalnız görünen bölümler sayılır --- */
var sira=[['dert','Dert'],['bedel','Bedel'],['urun','Sistem'],['ne','Ne yapıyoruz'],['kanallar','Kanallar'],['grafik','Neden hızlı'],['nasil','Süreç'],['yorumlar','Yorumlar'],['vakalar','Örnekler'],['neden','Fark'],['kim','Kim'],['guvence','Güvence'],['sorular','Sorular']];
var sayac=0, menu=[];
var menuAd={dert:'Dert',urun:'Sistem',kanallar:'Kanallar',nasil:'Süreç',sorular:'Sorular',kim:'Kim'};
sira.forEach(function(x){
  var sec=$('b-'+x[0]); if(!sec||sec.classList.contains('gizli'))return;
  sayac++;
  var e=$('no-'+x[0]); if(e)e.textContent=(sayac<10?'0':'')+sayac+' — '+(x[1]);
  if(menuAd[x[0]]&&menu.length<5)menu.push('<a href="#b-'+x[0]+'">'+menuAd[x[0]]+'</a>');
});
html('menu',menu.join(''));

/* --- görünür olunca belirme --- */
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('gor');io.unobserve(en.target);
    en.target.querySelectorAll('.ray i').forEach(function(i){i.style.width=i.getAttribute('data-w')+'%'})}})},{threshold:.12});
  document.querySelectorAll('.bel').forEach(function(e){io.observe(e)});
} else {
  document.querySelectorAll('.bel').forEach(function(e){e.classList.add('gor')});
  document.querySelectorAll('.ray i').forEach(function(i){i.style.width=i.getAttribute('data-w')+'%'});
}
})();
</script>
</body>
</html>
